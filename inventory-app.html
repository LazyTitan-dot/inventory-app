function App(){
  const [dark,setDark]=useState(()=>{try{const v=localStorage.getItem('es_dark');return v===null?true:v==='true';}catch(e){return true;}});
  useEffect(()=>{document.body.classList.toggle('dark',dark);try{localStorage.setItem('es_dark',dark?'true':'false');}catch(e){}},[dark]);
  // Force light mode when printing, restore after
  useEffect(()=>{
    const before=()=>document.body.classList.remove('dark');
    const after=()=>{if(dark)document.body.classList.add('dark');};
    window.addEventListener('beforeprint',before);window.addEventListener('afterprint',after);
    return()=>{window.removeEventListener('beforeprint',before);window.removeEventListener('afterprint',after);};
  },[dark]);

  // Load persisted data or fall back to seeds
  const savedData=useRef(loadData());
  const [products,setProducts]=useState(()=>savedData.current?.products||PRODS);
  const [sales,setSales]=useState(()=>savedData.current?.sales||[...INIT_SALES,...HIST_SALES]);
  const [customers,setCustomers]=useState(()=>savedData.current?.customers||INIT_CUSTS);
  const [suppliers,setSuppliers]=useState(()=>savedData.current?.suppliers||INIT_SUPPLIERS);
  const [purchaseOrders,setPurchaseOrders]=useState(()=>savedData.current?.purchaseOrders||INIT_POS);
  const [activityLog,setActivityLog,logActivity]=useActivityLog(savedData.current?.activityLog||[]);
  const [quotes,setQuotes]=useState(()=>savedData.current?.quotes||[]);
  const [returns,setReturns]=useState(()=>savedData.current?.returns||[]);
  const [deliveries,setDeliveries]=useState(()=>savedData.current?.deliveries||[]);
  const [promotions,setPromotions]=useState(()=>savedData.current?.promotions||[]);
  const [currency,setCurrency]=useState(()=>savedData.current?.currency||'USD');
  const [exchangeRate,setExchangeRate]=useState(()=>savedData.current?.exchangeRate||58.5);
  const [ncfSeq,setNcfSeq]=useState(()=>savedData.current?.ncfSeq||0);

  // ─── Supabase Auth + Cloud Sync ───
  const [fbUser,setFbUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [syncStatus,setSyncStatus]=useState('offline'); // synced|syncing|offline|error
  const [loginOpen,setLoginOpen]=useState(false);
  const [cloudReady,setCloudReady]=useState(false); // gates persist effect after initial cloud fetch
  const skipCloudSync=useRef(false);
  const lastWrittenStamp=useRef(''); // fingerprint of our last cloud write, for echo detection

  // Auth observer
  useEffect(()=>{
    const {data:{subscription}}=sbClient.auth.onAuthStateChange((_event,session)=>{
      const u=session?.user||null;
      // CRITICAL: Only update fbUser if the user identity actually changed.
      // onAuthStateChange fires periodically (TOKEN_REFRESHED, USER_UPDATED,
      // INITIAL_SESSION) with a fresh session object reference. If we naively
      // setFbUser every time, the cloud sync effect re-runs, sets
      // cloudReady=false, cancels any pending persist timers, and re-fetches
      // cloud — wiping out any unsaved local changes the user just made.
      setFbUser(prev=>(prev?.id===u?.id&&prev)?prev:u);
      _currentUid=u?.id||null;setAuthLoading(false);
      if(!u){_cloudReady=false;setCloudReady(false);setSyncStatus('offline');}
      else setSyncStatus(s=>s==='offline'?'syncing':s);
    });
    return()=>subscription.unsubscribe();
  },[]);

  // Supabase Realtime listener — sync cloud → local
  useEffect(()=>{
    if(!fbUser)return;
    // Block cloud writes AND persist effect until initial sync is resolved
    _cloudReady=false;setCloudReady(false);
    // Initial fetch
    (async()=>{
      try{
        const {data,error}=await sbClient.from('stores').select('data').eq('user_id',fbUser.id).maybeSingle();
        if(error){console.warn('Supabase read error:',error.message);setSyncStatus('error');_cloudReady=true;setCloudReady(true);return;}
        if(data&&data.data&&data.data.products){
          // Cloud data exists — always apply on initial sign-in.
          // We deliberately do NOT compare timestamps here: the persist
          // effect stamps `lastModified` on every save (even no-op saves
          // triggered by re-renders), so a device sitting idle accumulates
          // fresh timestamps and would wrongly appear "newer" than cloud.
          // Trust the cloud as the source of truth on login.
          const d=data.data;
          skipCloudSync.current=true;
          lastWrittenStamp.current=d.lastModified||''; // seed fingerprint
          setProducts(d.products);setSales(d.sales||[]);setCustomers(d.customers||[]);
          setSuppliers(d.suppliers||[]);setPurchaseOrders(d.purchaseOrders||[]);
          setActivityLog(d.activityLog||[]);setQuotes(d.quotes||[]);setReturns(d.returns||[]);
          setDeliveries(d.deliveries||[]);setPromotions(d.promotions||[]);
          if(d.currency)setCurrency(d.currency);if(d.exchangeRate)setExchangeRate(d.exchangeRate);
          if(d.ncfSeq!==undefined)setNcfSeq(d.ncfSeq);
          try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){}
          setTimeout(()=>{
            skipCloudSync.current=false;
            _cloudReady=true;setCloudReady(true);
          },600);
          setSyncStatus('synced');
        }else{
          // No cloud data — push local data to cloud
          const local=loadData();
          if(local){
            if(!local.lastModified)local.lastModified=new Date().toISOString();
            try{localStorage.setItem(STORAGE_KEY,JSON.stringify(local));}catch(e){}
            _cloudReady=true;setCloudReady(true);
            const {error:e}=await sbClient.from('stores').upsert({user_id:fbUser.id,data:local},{onConflict:'user_id'});
            if(e)console.warn('Migration write failed:',e.message);
          }else{
            _cloudReady=true;setCloudReady(true);
          }
          setSyncStatus('synced');
        }
      }catch(err){console.warn('Initial sync failed:',err);_cloudReady=true;setCloudReady(true);}
    })();

    // Realtime subscription for cross-device sync
    // Note: payload.new.data may be truncated for large JSONB blobs (>1MB),
    // so we fetch the full row via REST API when notified of a change.
    const channel=sbClient.channel('stores-sync').on('postgres_changes',{event:'*',schema:'public',table:'stores',filter:`user_id=eq.${fbUser.id}`},async()=>{
      if(skipCloudSync.current)return; // ignore echoes while applying cloud data
      const {data:row,error:fetchErr}=await sbClient.from('stores').select('data').eq('user_id',fbUser.id).maybeSingle();
      if(fetchErr||!row||!row.data)return;
      const d=row.data;
      if(!d||!d.products)return;
      // Fingerprint check: if the cloud row's lastModified exactly matches
      // the lastModified WE most recently wrote, this realtime event is the
      // echo of our own write. Skip it. This is more reliable than comparing
      // cloudTime > localTime, which breaks under races where local state
      // has diverged from localStorage between persist runs.
      if(d.lastModified&&d.lastModified===lastWrittenStamp.current){
        setSyncStatus('synced');
        return;
      }
      // Otherwise, this is a remote write from another device — apply it.
      skipCloudSync.current=true;
      setProducts(d.products);setSales(d.sales||[]);setCustomers(d.customers||[]);
      setSuppliers(d.suppliers||[]);setPurchaseOrders(d.purchaseOrders||[]);
      setActivityLog(d.activityLog||[]);setQuotes(d.quotes||[]);setReturns(d.returns||[]);
      setDeliveries(d.deliveries||[]);setPromotions(d.promotions||[]);
      if(d.currency)setCurrency(d.currency);if(d.exchangeRate)setExchangeRate(d.exchangeRate);
      if(d.ncfSeq!==undefined)setNcfSeq(d.ncfSeq);
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){}
      // Treat this remote-applied state as our last-written stamp so the
      // subsequent persist-effect re-save (which uses a fresh timestamp)
      // doesn't trigger a needless re-fetch loop.
      lastWrittenStamp.current=d.lastModified||'';
      setTimeout(()=>{skipCloudSync.current=false;},500);
      setSyncStatus('synced');
    }).subscribe();
    return()=>{sbClient.removeChannel(channel);};
  },[fbUser]);

  // Persist data on every change (localStorage + Supabase, after initial sync)
  const [saveState,setSaveState]=useState('idle');
  useEffect(()=>{
    // CRITICAL: Don't persist during auth loading window. Otherwise the
    // persist effect would stamp localStorage with a fresh `lastModified`
    // before we know if the user is signed in, and the subsequent cloud
    // sync would wrongly conclude that local is newer than cloud.
    if(authLoading)return;
    // While signed in, also wait for initial cloud sync to complete.
    if(fbUser&&!cloudReady)return;
    const timer=setTimeout(()=>{
      const stamp=new Date().toISOString();
      const payload={products,sales,customers,suppliers,purchaseOrders,activityLog,quotes,returns,deliveries,promotions,currency,exchangeRate,ncfSeq,lastModified:stamp};
      saveData(payload); // Always save to localStorage
      if(!skipCloudSync.current){
        lastWrittenStamp.current=stamp; // remember fingerprint for echo detection
        saveToCloud(payload); // saveToCloud checks _cloudReady internally
      }
      setSaveState('saved');
      if(fbUser&&!skipCloudSync.current)setSyncStatus('synced');
      setTimeout(()=>setSaveState('idle'),1500);
    },300);
    return()=>clearTimeout(timer);
  },[products,sales,customers,suppliers,purchaseOrders,activityLog,quotes,returns,deliveries,promotions,currency,exchangeRate,ncfSeq,fbUser,cloudReady,authLoading]);

  const [view,setView]=useState('dashboard');
  const [cat,setCat]=useState('all');
  const [q,setQ]=useState('');
  const [modal,setModal]=useState(null);
  const [delTarget,setDelTarget]=useState(null);
  const [newSaleOpen,setNewSaleOpen]=useState(false);
  const [newPOOpen,setNewPOOpen]=useState(false);
  const [newQuoteOpen,setNewQuoteOpen]=useState(false);

  const [kbdOpen,setKbdOpen]=useState(false);
  const [mobOpen,setMobOpen]=useState(false);
  const toast=useToast();

  // Global barcode scanner (when NOT in sale overlay)
  const gBcBuf=useRef('');const gBcTimer=useRef(null);
  useEffect(()=>{
    if(newSaleOpen||newQuoteOpen)return; // sale overlay has its own scanner
    const handler=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
      if(e.key==='Enter'&&gBcBuf.current.length>=4){
        const code=gBcBuf.current;gBcBuf.current='';
        const prod=products.find(p=>p.barcode===code||p.variants.some(v=>v.barcode===code));
        if(prod){
          const matchedVariant=prod.variants.find(v=>v.barcode===code);
          setView('inventory');setCat('all');setQ(code);
          // Auto-expand the matching product
          setProducts(ps=>ps.map(p=>p.id===prod.id?{...p,expanded:true}:p));
          const detail=matchedVariant?` — ${matchedVariant.name}`:'';
          toast(`Found: ${prod.brand} ${prod.model}${detail}`,{type:'success',title:'Barcode Scanned'});
        } else {
          setModal({mode:'add',prefill:{barcode:code}});setView('inventory');
          toast(`Barcode "${code}" not found — create a new product`,{type:'info',title:'New Barcode Scanned',duration:5000});
        }
        return;
      }
      if(e.key.length===1){gBcBuf.current+=e.key;clearTimeout(gBcTimer.current);gBcTimer.current=setTimeout(()=>{gBcBuf.current='';},100);}
    };
    window.addEventListener('keydown',handler);return()=>window.removeEventListener('keydown',handler);
  },[products,newSaleOpen,newQuoteOpen]);

  // Keyboard shortcuts
  useEffect(()=>{
    let gPending=false;let gTimer;
    const handler=e=>{
      const tag=e.target.tagName;
      const isInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.contentEditable==='true';
      // Cmd+K or Ctrl+K — spotlight
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setSpotlightOpen(o=>!o);return;}
      // Cmd+Shift+S — new sale
      if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key==='S'){e.preventDefault();setNewSaleOpen(true);return;}
      // Cmd+Shift+P — new product
      if((e.metaKey||e.ctrlKey)&&e.shiftKey&&e.key==='P'){e.preventDefault();setModal({mode:'add'});setView('inventory');return;}
      // Cmd+D — dark mode
      if((e.metaKey||e.ctrlKey)&&e.key==='d'){e.preventDefault();setDark(d=>!d);return;}
      if(isInput)return;
      // ? — shortcuts help
      if(e.key==='?'){setKbdOpen(o=>!o);return;}
      // G then nav keys
      if(e.key==='g'&&!gPending){gPending=true;gTimer=setTimeout(()=>{gPending=false;},800);return;}
      if(gPending){
        gPending=false;clearTimeout(gTimer);
        const nav={d:'dashboard',i:'inventory',s:'sales',c:'customers',u:'suppliers',p:'purchase_orders',a:'activity',q:'quotes',r:'returns',w:'warranties',e:'deliveries',m:'promotions'};
        if(nav[e.key])setView(nav[e.key]);

      }

    window.addEventListener('keydown',handler);
    return()=>window.removeEventListener('keydown',handler);

  };

  const completeSale=saleData=>{

      });
      return{...p,variants:uv};
    }));
    const c=saleData.customer;
    if(c.name&&!customers.find(x=>x.id===c.id)){setCustomers(cs=>[...cs,c]);logActivity('customer',`New customer <strong>${c.name}</strong> added via sale`);}

    toast(`Sale ${saleNum(saleData.saleNumber)} completed — ${fmtM(saleData.total)}`,{type:'success',title:'Sale Completed'});
  };

  };

  const savePO=po=>{

    toast(`Purchase order ${poNum(po.poNumber)} created`,{type:'success',title:'PO Created'});
  };

  // Quotes handlers
  const saveQuote=q=>{setQuotes(qs=>[...qs,q]);logActivity('sale',`Created quote <strong>${quoteNum(q.quoteNumber)}</strong>`,`${q.customer.name} · ${fmtM(q.total)}`);toast(`Quote ${quoteNum(q.quoteNumber)} created`,{type:'success',title:'Quote Created'});};
  const updateQuote=(id,updates)=>setQuotes(qs=>qs.map(q=>q.id===id?{...q,...updates}:q));
  const convertQuote=q=>{
    const s={id:uid(),saleNumber:sales.length+1,date:new Date().toISOString(),customer:q.customer,items:q.items,subtotal:q.subtotal,discountType:q.discountType,discountValue:q.discountValue,discountAmount:q.discountAmount,taxRate:q.taxRate,taxAmount:q.taxAmount,total:q.total,paymentMethod:'cash',status:'completed',notes:`Converted from ${quoteNum(q.quoteNumber)}`};
    completeSale(s);updateQuote(q.id,{status:'converted',convertedSaleId:s.id});toast(`Quote converted to Sale ${saleNum(s.saleNumber)}`,{type:'success'});
  };

  // Returns handler
  const createReturn=ret=>{
    setReturns(rs=>[...rs,ret]);
    if(ret.type==='refund'){
      setProducts(ps=>ps.map(p=>{const uv=p.variants.map(v=>({...v}));ret.items.forEach(item=>{if(item.productId===p.id){const vi=uv.findIndex(v=>v.id===item.variantId);if(vi>=0)uv[vi]={...uv[vi],quantity:uv[vi].quantity+(item.returnQty||0)};}});return{...p,variants:uv};}));
    }
    logActivity('sale',`Created return <strong>${returnNum(ret.returnNumber)}</strong>`,`${ret.customer.name} · −${fmtM(ret.refundAmount)}`);
    toast(`Return ${returnNum(ret.returnNumber)} processed`,{type:'success',title:'Return Completed'});
  };

  // Delivery handler
  const scheduleDelivery=d=>{setDeliveries(ds=>[...ds,d]);logActivity('sale',`Scheduled delivery for <strong>${saleNum(d.saleNumber)}</strong>`,`${d.customer.name} · ${d.date}`);};

  // Reorder alerts
  const reorderAlerts=useMemo(()=>{
    const alerts=[];
    products.forEach(p=>{p.variants.forEach(v=>{const min=Number(v.minStock)||5;const qty=Number(v.quantity)||0;if(qty<=min)alerts.push({product:p,variant:v,qty,min,reorderQty:Number(v.reorderQty)||10});});});
    return alerts;
  },[products]);

  // Multi-currency display helper
  const fmtC=n=>currency==='DOP'?'RD$'+Number(n*exchangeRate).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):fmtM(n);

  const todaySales=sales.filter(s=>s.status==='completed'&&new Date(s.date).toDateString()===new Date().toDateString()).length;
  const pendingSales=sales.filter(s=>s.status==='pending').length;
  const pendingPOs=purchaseOrders.filter(p=>p.status==='sent').length;

  // JSON import
  const importJSON=e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.products){setProducts(d.products);setSales(d.sales||[]);setCustomers(d.customers||[]);setSuppliers(d.suppliers||[]);setPurchaseOrders(d.purchaseOrders||[]);setActivityLog(d.activityLog||[]);setQuotes(d.quotes||[]);setReturns(d.returns||[]);setDeliveries(d.deliveries||[]);setPromotions(d.promotions||[]);if(d.currency)setCurrency(d.currency);if(d.exchangeRate)setExchangeRate(d.exchangeRate);if(d.ncfSeq)setNcfSeq(d.ncfSeq);
        logActivity('product','Imported data backup');toast('Data restored from backup',{type:'success',title:'Import Complete'});}
        else toast('Invalid backup file',{type:'error',title:'Import Failed'});
      }catch(err){toast('Failed to parse backup file',{type:'error',title:'Import Failed'});}
    };
    reader.readAsText(file);e.target.value='';
  };
  const importRef=useRef();

  const NAV=[
    {id:'dashboard',icon:'📊',label:'Dashboard',count:null},
    {id:'inventory',icon:'▦',label:'Inventory',count:invStats.total},
    {id:'sales',icon:'🧾',label:'Sales',count:sales.length},
    {id:'quotes',icon:'📝',label:'Cotizaciones',count:quotes.length>0?quotes.length:null},
    {id:'returns',icon:'↩️',label:'Devoluciones',count:returns.length>0?returns.length:null},
    {id:'warranties',icon:'🛡️',label:'Garantías',count:null},
    {id:'deliveries',icon:'🚛',label:'Entregas',count:deliveries.filter(d=>d.status!=='delivered').length||null},
    {id:'customers',icon:'👥',label:'Customers',count:customers.length},
    {id:'promotions',icon:'🏷️',label:'Promociones',count:promotions.length>0?promotions.length:null},
    {id:'suppliers',icon:'🏭',label:'Suppliers',count:suppliers.length},
    {id:'purchase_orders',icon:'📋',label:'Purchase Orders',count:purchaseOrders.length},
    {id:'activity',icon:'📜',label:'Activity Log',count:activityLog.length>0?activityLog.length:null},
  ];

  return(
    <DarkCtx.Provider value={dark}>
    <div className="app">
      <div className={`mob-overlay${mobOpen?' open':''}`} onClick={()=>setMobOpen(false)}/>
      <aside className={`sidebar${mobOpen?' mob-open':''}`} style={mobOpen?{transform:'translateX(0)'}:{}}>

            <span style={{width:34,height:34,borderRadius:9,background:'linear-gradient(145deg,#1a3a8f 0%,#2d5cc9 40%,#c0272d 100%)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:800,color:'#fff',flexShrink:0,letterSpacing:-.5,fontFamily:"'DM Sans',sans-serif",boxShadow:'0 2px 8px rgba(26,58,143,.35)'}}>SL</span>
            <div><div style={{fontSize:15,fontWeight:600,lineHeight:1.2}}><span style={{color:'#9CA3AF'}}>Smart</span><span style={{color:'#fff'}}>Living</span></div><div style={{fontSize:9,letterSpacing:2.5,color:'rgba(255,255,255,.45)',textTransform:'uppercase',marginTop:1}}>Home</div></div>
          </div>
          <div className="sb-sub">Compra Smart, Vive Smart</div>
        </div>
        <div className="sb-sect">
          <div className="sb-label">Management</div>
          {NAV.map(n=>(
            <div key={n.id} className={`nav-item${view===n.id?' active':''}`} onClick={()=>{setView(n.id);setMobOpen(false);}}>
              <span className="nav-icon">{n.icon}</span><span>{n.label}</span>{n.count!=null&&<span className="nav-count">{n.count}</span>}
            </div>
          ))}
        </div>
        {view==='inventory'&&(
          <div className="sb-sect" style={{marginTop:8}}>
            <div className="sb-label">Categories</div>
            {CATS.map(c=><div key={c.id} className={`nav-item${cat===c.id?' active':''}`} onClick={()=>{setCat(c.id);setMobOpen(false);}}><span className="nav-icon">{c.icon}</span><span>{c.label}</span><span className="nav-count">{catCounts[c.id]}</span></div>)}
          </div>
        )}
        <hr className="sb-divider"/>
        <div className="sb-sect">
          <div className="sb-label">Alerts</div>
          <div className="nav-item" style={{cursor:'default',color:invStats.low>0?'rgba(220,38,38,.9)':'rgba(255,255,255,.35)'}}>
            <span className="nav-icon">⚠</span><span>Low Stock</span>
            <span className="nav-count" style={invStats.low>0?{background:'rgba(220,38,38,.2)',color:'#F87171'}:{}}>{invStats.low}</span>
          </div>
          <div className="nav-item" style={{cursor:'default',color:todaySales>0?'rgba(16,185,129,.9)':'rgba(255,255,255,.35)'}}>
            <span className="nav-icon">✓</span><span>Sales Today</span>
            <span className="nav-count" style={todaySales>0?{background:'rgba(16,185,129,.15)',color:'#34D399'}:{}}>{todaySales}</span>
          </div>
          {pendingSales>0&&<div className="nav-item" style={{cursor:'default',color:'rgba(245,158,11,.9)'}}>
            <span className="nav-icon">⏳</span><span>Pending Sales</span>
            <span className="nav-count" style={{background:'rgba(245,158,11,.2)',color:'#F59E0B'}}>{pendingSales}</span>

          {pendingPOs>0&&<div className="nav-item" style={{cursor:'default',color:'rgba(99,102,241,.9)'}}>
            <span className="nav-icon">🚚</span><span>POs in Transit</span>
            <span className="nav-count" style={{background:'rgba(99,102,241,.2)',color:'#818CF8'}}>{pendingPOs}</span>
          </div>}
          {reorderAlerts.length>0&&<div className="nav-item" onClick={()=>setView('inventory')} style={{color:'rgba(245,158,11,.9)',cursor:'pointer'}}>
            <span className="nav-icon">📦</span><span>Reorder</span>
            <span className="nav-count" style={{background:'rgba(245,158,11,.2)',color:'#F59E0B'}}>{reorderAlerts.length}</span>
          </div>}
        </div>
        {/* Quick Actions */}
        <div className="sb-sect" style={{marginTop:8}}>
          <div className="sb-label">Quick Actions</div>
          <div className="nav-item" onClick={()=>setSpotlightOpen(true)} style={{color:'rgba(255,255,255,.45)'}}>

          </div>
          <div className="nav-item" onClick={()=>setKbdOpen(true)} style={{color:'rgba(255,255,255,.45)'}}>
            <span className="nav-icon">⌨</span><span>Shortcuts</span><span style={{marginLeft:'auto',fontSize:10,color:'rgba(255,255,255,.2)',fontFamily:"'IBM Plex Mono',monospace"}}>?</span>
          </div>
          <div className="nav-item" onClick={()=>setCurrency(c=>c==='USD'?'DOP':'USD')} style={{color:'rgba(255,255,255,.45)',cursor:'pointer'}}>
            <span className="nav-icon">💱</span><span>{currency==='USD'?'USD':'DOP'}</span><span style={{marginLeft:'auto',fontSize:10,color:'rgba(255,255,255,.3)',fontFamily:"'IBM Plex Mono',monospace"}}>{currency==='DOP'?`1 USD = ${exchangeRate} DOP`:''}</span>

              <span className="auth-user-email">{fbUser.email}</span>
              <button className="auth-btn-sm" onClick={()=>{sbClient.auth.signOut();_currentUid=null;_cloudReady=false;setSyncStatus('offline');}}>Sign out</button>
            </div>
          ):(
            <button className="auth-btn" onClick={()=>setLoginOpen(true)}>☁️ Sign In to Sync</button>
          )}

            <span>SmartLiving v4.0</span>
            <span className={`save-indicator ${saveState}`}><span className="save-dot"/>
              {saveState==='saved'?'Saved':saveState==='saving'?'Saving…':''}
            </span>
          </div>
          <button className="dm-toggle" onClick={()=>setDark(d=>!d)} title={dark?'Switch to Light Mode':'Switch to Dark Mode'}>
            {dark?'☀️':'🌙'}
          </button>
        </div>
      </aside>

      <div className="main">
        <button className="mob-hamburger" onClick={()=>setMobOpen(o=>!o)} aria-label="Menu">☰</button>
        {view==='dashboard'&&<DashboardPage sales={sales} products={products} purchaseOrders={purchaseOrders} customers={customers} onNewSale={()=>setNewSaleOpen(true)}/>}
        {view==='inventory'&&(
          <>
            <div className="topbar">
              <div className="topbar-title">{cat==='all'?'All Products':CATS.find(c=>c.id===cat)?.label}</div>
              <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-input" placeholder="Search brand, model, SKU, barcode…" value={q} onChange={e=>setQ(e.target.value)}/></div>
              <div className="topbar-actions">
                <ExportMenu onExportCSV={()=>{exportInventoryCSV(products);toast('Inventory exported as CSV',{type:'success'});}} onExportJSON={()=>{exportJSON({products,sales,customers,suppliers,purchaseOrders,activityLog,quotes,returns,deliveries,promotions,currency,exchangeRate,ncfSeq});toast('Full backup exported',{type:'success'});}}/>
                <button className="btn-sale" onClick={()=>setNewSaleOpen(true)}>+ New Sale</button>
                <button className="btn-add" onClick={()=>setModal({mode:'add'})}>+ Add Product</button>
              </div>
            </div>
            <div className="stats-strip">
              <div className="stat-cell"><div className="stat-lbl">Products</div><div className="stat-val">{invStats.total}</div><div className="stat-hint">{invStats.skus} variant SKUs</div></div>
              <div className="stat-cell"><div className="stat-lbl">Units in Stock</div><div className="stat-val">{invStats.units}</div><div className="stat-hint">across all variants</div></div>
              <div className="stat-cell"><div className="stat-lbl">Inventory Cost</div><div className="stat-val money"><span className="money-sym">$</span>{Math.round(invStats.invCost).toLocaleString()}</div><div className="stat-hint">total cost value</div></div>
              <div className="stat-cell"><div className="stat-lbl">Retail Value</div><div className="stat-val money green"><span className="money-sym" style={{color:'#86EFAC'}}>$</span>{Math.round(invStats.retail).toLocaleString()}</div><div className="stat-hint">potential revenue</div></div>
              <div className="stat-cell"><div className="stat-lbl">Low Stock</div><div className={`stat-val${invStats.low>0?' danger':''}`}>{invStats.low}</div><div className="stat-hint">{invStats.low===0?'All stocked up':'need restocking'}</div></div>
            </div>
            <div className="content">
              {!filtered.length?(
                <div className="empty"><div className="empty-icon">{q?'🔍':'📦'}</div><div className="empty-h">{q?'No results found':'No products yet'}</div><div className="empty-p">{q?`No products match "${q}"`:'Add your first product above'}</div></div>
              ):filtered.map(p=>(
                <ProductCard key={p.id} product={p} onEdit={p=>setModal({mode:'edit',product:p})} onDelete={setDelTarget} onToggle={toggleExpand} onAdjustStock={adjustStock}/>
              ))}
            </div>
          </>
        )}
        {view==='sales'&&<SalesPage sales={sales} onNewSale={()=>setNewSaleOpen(true)} onVoid={voidSale} onExportCSV={()=>{exportSalesCSV(sales);toast('Sales exported as CSV',{type:'success'});}} onCreateReturn={sale=>{setView('returns');}}/>}
        {view==='quotes'&&<QuotesPage quotes={quotes} onNewQuote={()=>setNewQuoteOpen(true)} onConvert={convertQuote} onUpdateQuote={updateQuote} toast={toast}/>}
        {view==='returns'&&<ReturnsPage returns={returns} sales={sales} onCreateReturn={createReturn} toast={toast}/>}
        {view==='warranties'&&<WarrantyPage sales={sales} products={products}/>}
        {view==='deliveries'&&<DeliveriesPage deliveries={deliveries} setDeliveries={setDeliveries} toast={toast}/>}
        {view==='customers'&&<CustomersPage customers={customers} setCustomers={setCustomers} sales={sales} onNewSale={()=>setNewSaleOpen(true)} toast={toast} logActivity={logActivity}/>}
        {view==='promotions'&&<PromotionsPage promotions={promotions} setPromotions={setPromotions} toast={toast}/>}
        {view==='suppliers'&&<SuppliersPage suppliers={suppliers} setSuppliers={setSuppliers} purchaseOrders={purchaseOrders} toast={toast} logActivity={logActivity}/>}
        {view==='purchase_orders'&&<PurchaseOrdersPage purchaseOrders={purchaseOrders} setPurchaseOrders={setPurchaseOrders} suppliers={suppliers} products={products} setProducts={setProducts} onNewPO={()=>setNewPOOpen(true)} toast={toast} logActivity={logActivity}/>}
        {view==='activity'&&<ActivityLogPage log={activityLog}/>}
      </div>

      {modal&&<ProductModal product={modal.mode==='edit'?modal.product:null} prefill={modal.prefill} onClose={()=>setModal(null)} onSave={saveProd}/>}
      {delTarget&&<ConfirmModal product={delTarget} onClose={()=>setDelTarget(null)} onConfirm={delProd}/>}
      {newSaleOpen&&<NewSaleOverlay products={products} customers={customers} sales={sales} onClose={()=>setNewSaleOpen(false)} onComplete={saleData=>{completeSale(saleData);}} promotions={promotions} onScheduleDelivery={scheduleDelivery} ncfSeq={ncfSeq} onNcfUsed={()=>setNcfSeq(s=>s+1)} onBarcodeNotFound={code=>{setNewSaleOpen(false);setModal({mode:'add',prefill:{barcode:code}});toast(`Barcode "${code}" not found — create a new product`,{type:'info',title:'New Barcode Scanned',duration:5000});}}/>}
      {newQuoteOpen&&<NewQuoteOverlay products={products} customers={customers} quotes={quotes} onClose={()=>setNewQuoteOpen(false)} onSave={saveQuote}/>}
      {newPOOpen&&<NewPOOverlay products={products} suppliers={suppliers} purchaseOrders={purchaseOrders} onClose={()=>setNewPOOpen(false)} onSave={savePO}/>}
      {spotlightOpen&&<SpotlightSearch products={products} sales={sales} customers={customers} suppliers={suppliers} purchaseOrders={purchaseOrders} onNavigate={v=>{setView(v);}} onClose={()=>setSpotlightOpen(false)}/>}
      {kbdOpen&&<KbdShortcutsModal onClose={()=>setKbdOpen(false)}/>}
      {loginOpen&&<LoginModal onClose={()=>setLoginOpen(false)} onSuccess={()=>{toast('Signed in — data will sync across devices',{type:'success',title:'Cloud Sync Active'});}}/>}
      <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={importJSON}/>
    </div>
    </DarkCtx.Provider>
  );
}

/* ─── Login Modal ──────────────────────────────────────────── */
function LoginModal({onClose,onSuccess}){
  const dark=useDark();
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const handleAuth=async(isCreate)=>{
    if(!email.trim()||!pass.trim()){setErr('Email and password required');return;}
    setLoading(true);setErr('');
    try{
      const {error}=isCreate
        ?await sbClient.auth.signUp({email,password:pass})
        :await sbClient.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      onSuccess&&onSuccess();onClose();
    }catch(e){
      const msg=e.message||'Authentication failed';
      setErr(msg);
    }finally{setLoading(false);}
  };

  return(
    <div className="login-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="login-card">
        <h2>☁️ Cloud Sync</h2>
        <p>Sign in to sync your data across all devices. Use the same account on your PC and phone.</p>
        {err&&<div className="login-error">{err}</div>}
        <div className="login-field">
          <label>Email</label>
          <input type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAuth(false)} autoFocus/>
        </div>
        <div className="login-field">
          <label>Password</label>
          <input type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAuth(false)}/>
        </div>
        <div className="login-actions">
          <button className="btn-login" onClick={()=>handleAuth(false)} disabled={loading}>{loading?'Signing in…':'Sign In'}</button>
          <button className="btn-create-acct" onClick={()=>handleAuth(true)} disabled={loading}>Create Account</button>
        </div>
        <div style={{textAlign:'center',marginTop:14}}>
          <button style={{background:'none',border:'none',fontSize:11,color:'#888',cursor:'pointer',fontFamily:'inherit'}} onClick={onClose}>Cancel — continue offline</button>
        </div>
      </div>
    </div>
  );
}

function WrappedApp(){return <ToastProvider><App/></ToastProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<WrappedApp/>);
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>
