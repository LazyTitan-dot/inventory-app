            </div>
          </div>
        </div>

        {/* ── RIGHT PANEL: CART & ORDER ── */}
        <div className="sale-right">
          <div className="cart-hd">
            <div className="cart-hd-title">Order Summary {cart.length>0&&<span className="cart-badge">{cartUnits} item{cartUnits!==1?'s':''}</span>}</div>
            {cart.length>0&&<button style={{background:'none',border:'none',fontSize:11,color:'#DC2626',cursor:'pointer',fontFamily:'inherit'}} onClick={()=>setCart([])}>Clear all</button>}
          </div>

          {!cart.length?(
            <div className="cart-empty-state"><div className="cart-empty-icon">🛒</div><div style={{fontSize:13}}>No items added yet</div><div style={{fontSize:11,color:'#C8C4BB',marginTop:4}}>Search and add products from the left</div></div>
          ):(
            <div className="cart-items-wrap">
              {cart.map(item=>(
                <div key={item.key} className="ci">
                  <div className="ci-info">
                    <div className="ci-name">{item.productBrand} {item.productModel}</div>
                    <div className="ci-var">{item.variantName} · {fmtShort(item.price)} each</div>
                    <div className="ci-linetotal">{fmtM(item.price*item.quantity)}</div>
                  </div>
                  <div className="ci-stepper">
                    <button onClick={()=>updCIQty(item.key,item.quantity-1,item.maxQty)}>−</button>
                    <input type="number" min="1" max={item.maxQty} value={item.quantity} onChange={e=>updCIQty(item.key,e.target.value,item.maxQty)}/>
                    <button onClick={()=>updCIQty(item.key,item.quantity+1,item.maxQty)}>+</button>
                  </div>
                  <button className="ci-rm" onClick={()=>rmCI(item.key)}>×</button>
                </div>
              ))}
            </div>
          )}

          {/* Totals */}
          <div className="ot-wrap">
            <div className="ot-row"><span className="ot-lbl">Subtotal</span><span className="ot-val">{fmtM(subtotal)}</span></div>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:10,fontWeight:500,textTransform:'uppercase',letterSpacing:'.5px',color:'#A8A59C',marginBottom:6}}>Discount</div>
              <div className="disc-row">
                <div className="disc-toggle">
                  <button className={`dt-btn${discType==='percent'?' active':''}`} onClick={()=>setDiscType('percent')}>%</button>
                  <button className={`dt-btn${discType==='fixed'?' active':''}`} onClick={()=>setDiscType('fixed')}>$</button>
                </div>
                <input className="disc-input" type="number" min="0" placeholder={discType==='percent'?'0':'0.00'} value={discVal} onChange={e=>setDiscVal(e.target.value)}/>
              </div>
              {discAmt>0&&<div style={{fontSize:11,color:'#059669',textAlign:'right',marginTop:3}}>− {fmtM(discAmt)} saved</div>}
            </div>
            <div className="tax-row">
              <div className="sw-wrap" onClick={()=>setTaxOn(t=>!t)}>
                <div className={`sw${taxOn?' on':''}`}/>
                <span style={{fontSize:13,color:'#666'}}>ITBIS Tax</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:5}}>
                <input className="tax-rate" type="number" min="0" max="100" value={taxRate} onChange={e=>setTaxRate(Number(e.target.value)||0)} disabled={!taxOn}/>
                <span style={{fontSize:12,color:'#B0ADA4'}}>%</span>
                <span className="ot-val">{taxOn?fmtM(taxAmt):'—'}</span>
              </div>
            </div>
            <hr className="ot-hr"/>
            <div className="ot-total"><span className="ot-total-lbl">Total</span><span className="ot-total-val">{fmtM(total)}</span></div>
          </div>

          {/* Payment */}
          <div className="pay-wrap">
            <div className="pay-lbl-title">Payment Method</div>
            <div className="pay-opts">
              {PAY_OPTS.map(o=>(
                <button key={o.id} className={`pay-opt${payment===o.id?' active':''}`} onClick={()=>setPayment(o.id)}>
                  <div className="pay-icon">{o.icon}</div>
                  <div className="pay-name">{o.label}</div>
                </button>
              ))}
            </div>
          </div>

          {/* NCF / Comprobante Fiscal */}
          <div className="note-wrap">
            <div className="pay-lbl-title">Comprobante Fiscal (NCF)</div>
            <select value={ncfType} onChange={e=>setNcfType(e.target.value)} style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid #E8E6E0',fontSize:13,fontFamily:'inherit'}}>
              <option value="">Sin comprobante</option>
              {Object.entries(NCF_TYPES).map(([k,v])=><option key={k} value={k}>{k} — {v}</option>)}
            </select>
            {ncfType&&<div style={{fontSize:11,color:'#1E40AF',marginTop:4}}>NCF: {fmtNCF(ncfType,(ncfSeq||0)+1)}</div>}
          </div>

          {/* Coupon Code */}
          <div className="note-wrap">
            <div className="pay-lbl-title">Coupon Code</div>
            <div style={{display:'flex',gap:6}}>
              <input value={couponCode} onChange={e=>setCouponCode(e.target.value.toUpperCase())} placeholder="Enter code…" style={{flex:1,padding:'8px 10px',borderRadius:8,border:'1px solid #E8E6E0',fontSize:13,fontFamily:"'IBM Plex Mono',monospace"}}/>
              <button className="btn-secondary" style={{fontSize:11,whiteSpace:'nowrap'}} onClick={applyCoupon}>Apply</button>
            </div>
            {couponApplied&&<div style={{fontSize:11,color:'#059669',marginTop:4}}>Coupon "{couponApplied.code}" applied — {couponApplied.type==='percent'?`${couponApplied.value}% off`:`$${couponApplied.value} off`}</div>}
          </div>

          {/* Delivery Scheduling */}
          <div className="note-wrap">
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <div className="sw-wrap" onClick={()=>setSchedDelivery(d=>!d)}><div className={`sw${schedDelivery?' on':''}`}/></div>
              <span className="pay-lbl-title" style={{margin:0}}>Schedule Delivery</span>
            </div>
            {schedDelivery&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <div><label style={{fontSize:11,display:'block',marginBottom:3,color:'#888'}}>Date</label><input type="date" value={deliveryDate} onChange={e=>setDeliveryDate(e.target.value)} style={{width:'100%',padding:'6px 8px',borderRadius:6,border:'1px solid #E8E6E0',fontSize:12}}/></div>
              <div><label style={{fontSize:11,display:'block',marginBottom:3,color:'#888'}}>Time Slot</label><select value={deliverySlot} onChange={e=>setDeliverySlot(e.target.value)} style={{width:'100%',padding:'6px 8px',borderRadius:6,border:'1px solid #E8E6E0',fontSize:12}}>{DELIVERY_SLOTS.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
              <div style={{gridColumn:'1/-1'}}><label style={{fontSize:11,display:'block',marginBottom:3,color:'#888'}}>Driver</label><input value={deliveryDriver} onChange={e=>setDeliveryDriver(e.target.value)} placeholder="Driver name…" style={{width:'100%',padding:'6px 8px',borderRadius:6,border:'1px solid #E8E6E0',fontSize:12}}/></div>
            </div>}
          </div>

          {/* Note */}
          <div className="note-wrap">
            <div className="pay-lbl-title">Sale Note</div>
            <textarea className="note-ta" placeholder="Delivery instructions, special requests, fiscal note…" value={saleNote} onChange={e=>setSaleNote(e.target.value)}/>
          </div>

          <div className="sale-footer">
            <button className="btn-complete" style={{width:'100%',justifyContent:'center',fontSize:15}} onClick={complete} disabled={!cust.name.trim()||!cart.length}>
              ✓ Complete Sale{total>0?` · ${fmtM(total)}`:''}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

          <button className="btn-primary" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ─── Sales History Page ─────────────────────────────────────── */
function SalesPage({sales,onNewSale,onVoid,onExportCSV,onCreateReturn}){
  const [q,setQ]=useState('');
  const [sf,setSf]=useState('all');
  const [detail,setDetail]=useState(null);

  const filtered=useMemo(()=>{
    let list=[...sales];
    if(sf!=='all')list=list.filter(s=>s.status===sf);
    if(q.trim()){
      const sq=q.toLowerCase();
      list=list.filter(s=>
        s.customer.name.toLowerCase().includes(sq)||
        saleNum(s.saleNumber).includes(sq)||
        s.items.some(i=>i.productBrand.toLowerCase().includes(sq)||i.productModel.toLowerCase().includes(sq)||i.variantName.toLowerCase().includes(sq))||
        (s.customer.phone||'').includes(sq)||
        (s.customer.email||'').toLowerCase().includes(sq)||
        (s.customer.city||'').toLowerCase().includes(sq)
      );
    }
    return list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  },[sales,q,sf]);

  const stats=useMemo(()=>{
    const todayStr=new Date().toDateString();
    const done=sales.filter(s=>s.status==='completed');
    const today=done.filter(s=>new Date(s.date).toDateString()===todayStr);
    const rev=done.reduce((s,x)=>s+x.total,0);
    const avg=done.length?rev/done.length:0;
    const pending=sales.filter(s=>s.status==='pending').length;
    return{total:sales.length,todayCount:today.length,todayRev:today.reduce((s,x)=>s+x.total,0),rev,avg,pending};
  },[sales]);

  const stCls={completed:'sb-completed',pending:'sb-pending',void:'sb-void'};
  const payIcon={cash:'💵',card:'💳',transfer:'🏦'};
  const payLabel={cash:'Cash',card:'Card',transfer:'Transfer'};

  return(
    <>
      <div className="topbar">
        <div className="topbar-title">Sales</div>
        <div className="search-wrap">
          <span className="search-icon">🔍</span>
          <input className="search-input" placeholder="Search customer, sale #, product, city…" value={q} onChange={e=>setQ(e.target.value)}/>
        </div>
        <div className="topbar-actions">
          <div className="filter-tabs">
            {['all','completed','pending','void'].map(s=>(
              <button key={s} className={`f-tab${sf===s?' active':''}`} onClick={()=>setSf(s)}>
                {s.charAt(0).toUpperCase()+s.slice(1)}
                {s!=='all'&&<span style={{marginLeft:4,opacity:.7}}>({sales.filter(x=>x.status===s).length})</span>}
              </button>
            ))}
          </div>
          {onExportCSV&&<ExportMenu onExportCSV={onExportCSV}/>}

/* ─── Purchase Orders Page ───────────────────────────────────── */
const PO_STATUSES=['draft','sent','received','cancelled'];
const PO_STATUS_NEXT={draft:'sent',sent:'received'};

function NewPOOverlay({products,suppliers,purchaseOrders,onClose,onSave}){
  const [supplierId,setSupplierId]=useState(suppliers[0]?.id||'');
  const [expectedDelivery,setExpectedDelivery]=useState('');
  const [taxRate,setTaxRate]=useState(18);
  const [taxOn,setTaxOn]=useState(true);
  const [notes,setNotes]=useState('');
  const [items,setItems]=useState([{id:uid(),productId:'',variantId:'',productBrand:'',productModel:'',variantName:'',qty:1,unitCost:'',total:0}]);

  const selSupplier=suppliers.find(s=>s.id===supplierId);

  const updateItem=(id,k,v)=>setItems(items=>items.map(it=>{
    if(it.id!==id)return it;
    const updated={...it,[k]:v};
    if(k==='productId'){
      const p=products.find(x=>x.id===v);
      if(p){updated.productBrand=p.brand;updated.productModel=p.model;updated.variantId=p.variants[0]?.id||'';updated.variantName=p.variants[0]?.name||'';updated.unitCost=p.variants[0]?.cost||'';}
    }
    if(k==='variantId'){
      const p=products.find(x=>x.id===updated.productId);
      const vr=p?.variants.find(v2=>v2.id===v);
      if(vr){updated.variantName=vr.name;updated.unitCost=vr.cost||'';}
    }
    updated.total=Number(updated.qty||0)*Number(updated.unitCost||0);
    return updated;
  }));
  const addItem=()=>setItems(it=>[...it,{id:uid(),productId:'',variantId:'',productBrand:'',productModel:'',variantName:'',qty:1,unitCost:'',total:0}]);
  const rmItem=id=>setItems(it=>it.filter(x=>x.id!==id));

  const subtotal=items.reduce((s,i)=>s+i.total,0);
  const taxAmt=taxOn?subtotal*(taxRate/100):0;
  const grandTotal=subtotal+taxAmt;

  const save=()=>{
    if(!supplierId)return alert('Select a supplier.');
    if(!items.some(i=>i.productId))return alert('Add at least one product.');
    const validItems=items.filter(i=>i.productId);
    const po={id:uid(),poNumber:purchaseOrders.length+1,date:new Date().toISOString(),supplierId,supplierName:selSupplier?.name||'',items:validItems.map(i=>({...i,qty:Number(i.qty)||1,unitCost:Number(i.unitCost)||0,total:Number(i.qty||1)*Number(i.unitCost||0)})),subtotal,taxRate:taxOn?taxRate:0,taxAmount:taxAmt,grandTotal,expectedDelivery,status:'draft',notes};
    onSave(po);onClose();
  };
  return(
    <div className="po-overlay">
      <div className="po-hdr-bar">
        <div style={{fontSize:16,fontWeight:700,color:'#111',fontFamily:"'IBM Plex Mono',monospace",flexShrink:0}}>New PO {poNum(purchaseOrders.length+1)}</div>
        <div style={{fontSize:13,color:'#B0ADA4',flex:1}}>Supplier: <b style={{color:'#555',fontWeight:500}}>{selSupplier?.name||'—'}</b></div>
        <button className="btn-cancel-sale" onClick={onClose}>✕ Cancel</button>
        <button className="btn-complete" onClick={save}>Save as Draft</button>
      </div>
      <div className="po-body">
        <div className="po-left">
          {/* Supplier */}
          <div className="po-section">
            <div className="po-sec-hd"><div className="po-sec-title"><span className="sec-num">1</span> Supplier & Details</div></div>
            <div className="po-sec-body">
              <div className="form-grid">
                <div className="fg span2"><label>Supplier *</label>
                  <select value={supplierId} onChange={e=>setSupplierId(e.target.value)}>
                    {suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                </div>
                <div className="fg"><label>Expected Delivery</label><input type="date" value={expectedDelivery} onChange={e=>setExpectedDelivery(e.target.value)} style={{fontFamily:'inherit'}}/></div>
                <div className="fg"><label>Tax Rate (ITBIS)</label>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <div className="sw-wrap" onClick={()=>setTaxOn(t=>!t)} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:6}}><div className={`sw${taxOn?' on':''}`}/><span style={{fontSize:13,color:'#666'}}>Apply tax</span></div>
                    <input type="number" min="0" max="100" value={taxRate} onChange={e=>setTaxRate(Number(e.target.value)||0)} disabled={!taxOn} className="tax-rate" style={{marginLeft:'auto'}}/>
                    <span style={{fontSize:12,color:'#B0ADA4'}}>%</span>
                  </div>
                </div>
                {selSupplier&&<div className="fg span2"><div style={{background:'#F8F7F4',borderRadius:8,padding:'10px 12px',fontSize:12,color:'#666'}}><strong style={{color:'#111'}}>{selSupplier.contact||selSupplier.name}</strong>{selSupplier.phone&&` · ${selSupplier.phone}`}{selSupplier.paymentTerms&&<span style={{marginLeft:8,background:'#EEF2FF',color:'#4338CA',borderRadius:4,padding:'1px 6px',fontSize:11}}>{selSupplier.paymentTerms}</span>}</div></div>}
              </div>
            </div>
          </div>

          {/* Items */}
          <div className="po-section">
            <div className="po-sec-hd">
              <div className="po-sec-title"><span className="sec-num">2</span> Order Items</div>
              <button className="btn-av" onClick={addItem}>+ Add Item</button>
            </div>
            <div>
              <div className="poi-cols" style={{gridTemplateColumns:'1.6fr 1fr 60px 100px 80px 28px'}}>
                <span>Product</span><span>Variant</span><span>Qty</span><span>Unit Cost</span><span style={{textAlign:'right'}}>Total</span><span/>
              </div>
              {items.map(item=>{
                const selProd=products.find(p=>p.id===item.productId);
                return(
                  <div key={item.id} className="poi-row" style={{gridTemplateColumns:'1.6fr 1fr 60px 100px 80px 28px'}}>
                    <select value={item.productId} onChange={e=>updateItem(item.id,'productId',e.target.value)}>
                      <option value="">— Select product —</option>
                      {products.map(p=><option key={p.id} value={p.id}>{p.brand} {p.model}</option>)}
                    </select>
                    <select value={item.variantId} onChange={e=>updateItem(item.id,'variantId',e.target.value)} disabled={!selProd}>
                      {selProd?selProd.variants.map(v=><option key={v.id} value={v.id}>{v.name}</option>):<option>—</option>}
                    </select>
                    <input type="number" min="1" className="mono-in" value={item.qty} onChange={e=>updateItem(item.id,'qty',e.target.value)}/>
                    <div className="input-prefix"><span style={{left:8,fontSize:12}}>$</span><input type="number" min="0" step="0.01" className="mono-in" style={{paddingLeft:20}} value={item.unitCost} onChange={e=>updateItem(item.id,'unitCost',e.target.value)}/></div>
                    <div style={{textAlign:'right',fontFamily:"'IBM Plex Mono',monospace",fontSize:12.5,fontWeight:600,color:'#111',alignSelf:'center'}}>{item.total>0?fmtM(item.total):'—'}</div>
                    <button className="btn-rm" onClick={()=>rmItem(item.id)}>×</button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Notes */}
          <div className="po-section">
            <div className="po-sec-hd"><div className="po-sec-title"><span className="sec-num">3</span> Notes</div></div>
            <div className="po-sec-body"><textarea className="note-ta" style={{height:70,width:'100%'}} placeholder="Special instructions, customs info, delivery notes…" value={notes} onChange={e=>setNotes(e.target.value)}/></div>
          </div>
        </div>

        {/* Right summary */}
        <div className="po-right-panel">
          <div className="cart-hd"><div className="cart-hd-title">Order Summary</div></div>
          {!items.filter(i=>i.productId).length?(
            <div className="cart-empty-state"><div className="cart-empty-icon">📦</div><div style={{fontSize:13}}>No items added yet</div></div>
          ):(
            <div className="cart-items-wrap">
              {items.filter(i=>i.productId).map(item=>(
                <div key={item.id} className="ci">
                  <div className="ci-info">
                    <div className="ci-name">{item.productBrand} {item.productModel}</div>
                    <div className="ci-var">{item.variantName} · ×{item.qty}</div>
                    <div className="ci-linetotal">{item.total>0?fmtM(item.total):'—'}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
          <div className="ot-wrap">
            <div className="ot-row"><span className="ot-lbl">Subtotal</span><span className="ot-val">{fmtM(subtotal)}</span></div>
            {taxOn&&<div className="ot-row"><span className="ot-lbl">ITBIS ({taxRate}%)</span><span className="ot-val">{fmtM(taxAmt)}</span></div>}
            <hr className="ot-hr"/>
            <div className="ot-total"><span className="ot-total-lbl">Grand Total</span><span className="ot-total-val">{fmtM(grandTotal)}</span></div>
          </div>
          <div className="sale-footer"><button className="btn-complete" style={{width:'100%',justifyContent:'center'}} onClick={save}>Save as Draft · {fmtM(grandTotal)}</button></div>
        </div>
      </div>
    </div>
  );
}

function PurchaseOrdersPage({purchaseOrders,setPurchaseOrders,suppliers,products,setProducts,onNewPO,toast,logActivity}){
  const [q,setQ]=useState('');
  const [sf,setSf]=useState('all');
  const [detail,setDetail]=useState(null);

  const filtered=useMemo(()=>{
    let list=[...purchaseOrders];
    if(sf!=='all')list=list.filter(p=>p.status===sf);
    if(q.trim()){const sq=q.toLowerCase();list=list.filter(p=>p.supplierName.toLowerCase().includes(sq)||poNum(p.poNumber).toLowerCase().includes(sq)||p.items.some(i=>i.productBrand.toLowerCase().includes(sq)||i.productModel.toLowerCase().includes(sq)));}
    return list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  },[purchaseOrders,q,sf]);

  const updateStatus=(id,status)=>{const po=purchaseOrders.find(p=>p.id===id);setPurchaseOrders(pos=>pos.map(p=>p.id===id?{...p,status}:p));if(po&&toast)toast(`${poNum(po.poNumber)} marked as ${status}`,{type:'success'});if(po&&logActivity)logActivity('po',`Updated <strong>${poNum(po.poNumber)}</strong> to ${status}`);};
  const receivePO=id=>{
    const po=purchaseOrders.find(p=>p.id===id);if(!po)return;
    const totalUnits=po.items.reduce((s,i)=>s+i.qty,0);
    // Add stock
    setProducts(prods=>prods.map(prod=>{
      const uv=prod.variants.map(v=>({...v}));
      po.items.forEach(item=>{
        if(item.productId===prod.id){
          const vi=uv.findIndex(v=>v.id===item.variantId);
          if(vi>=0)uv[vi]={...uv[vi],quantity:uv[vi].quantity+item.qty};
        }
      });
      return{...prod,variants:uv};
    }));
    setPurchaseOrders(pos=>pos.map(p=>p.id===id?{...p,status:'received'}:p));
    if(toast)toast(`${poNum(po.poNumber)} received — ${totalUnits} units added to stock`,{type:'success',title:'PO Received'});
    if(logActivity)logActivity('po',`Received <strong>${poNum(po.poNumber)}</strong> from ${po.supplierName}`,`${totalUnits} units added · ${fmtM(po.grandTotal)}`);
  };

  const totalCommitted=purchaseOrders.filter(p=>['draft','sent'].includes(p.status)).reduce((s,p)=>s+p.grandTotal,0);

/* Shared tooltip — plain fixed div, no portal needed */
function Tooltip({tip}){
  if(!tip)return null;
  const GAP=16;
  const flipLeft=typeof window!=='undefined'&&tip.x+GAP+220>window.innerWidth;
  return(
    <div style={{
      position:'fixed',
      left:flipLeft?'auto':tip.x+GAP,
      right:flipLeft?window.innerWidth-tip.x+GAP:' auto',
      top:tip.y,
      transform:'translateY(-50%)',
      zIndex:9999,
      background:'#1C1B18',
      color:'#fff',
      borderRadius:9,
      padding:'9px 13px',
      fontSize:12,
      lineHeight:1.55,
      pointerEvents:'none',
      boxShadow:'0 6px 24px rgba(0,0,0,.25)',
      minWidth:148,
      maxWidth:230,
      whiteSpace:'pre-line',
    }}>{tip.content}</div>
  );
}

function TRow({label,value,color}){
  return(
    <div style={{display:'flex',justifyContent:'space-between',gap:14,alignItems:'center',marginTop:3}}>
      <span style={{color:'rgba(255,255,255,.6)',fontSize:11}}>
        {color&&<span style={{display:'inline-block',width:7,height:7,borderRadius:2,background:color,marginRight:5,verticalAlign:'middle'}}/>}
        {label}
      </span>
      <span style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:600,color:'#fff',fontSize:12}}>{value}</span>
    </div>
  );
}

function DonutChart({segments,size=128}){
  const [tip,setTip]=useState(null);
  const valid=segments.filter(s=>s.value>0);
  const total=valid.reduce((s,x)=>s+x.value,0);
  if(!total)return <div className="db-empty">No data</div>;
  const cx=size/2,cy=size/2,r=size/2-3,ri=r*.56;

  const showTip=(e,seg)=>{
    const pct=total>0?Math.round(seg.value/total*100):0;
    setTip({x:e.clientX,y:e.clientY,content:(
      <div>
        <div style={{fontWeight:700,marginBottom:5,fontSize:12.5,borderBottom:'1px solid rgba(255,255,255,.12)',paddingBottom:5}}>{seg.label}</div>
        <TRow label="Value" value={fmtM(seg.value)} color={seg.color}/>
        <TRow label="Share" value={`${pct}%`}/>
      </div>
    )});
  };
  const hideTip=()=>setTip(null);
  const moveTip=e=>tip&&setTip(t=>({...t,x:e.clientX,y:e.clientY}));

  if(valid.length===1){
    return(
      <>
        <svg viewBox={`0 0 ${size} ${size}`} style={{width:size,height:size,display:'block',flexShrink:0,cursor:'crosshair'}}
          onMouseMove={moveTip}
          onMouseLeave={hideTip}>
          <circle cx={cx} cy={cy} r={r} fill={valid[0].color}
            onMouseEnter={e=>showTip(e,valid[0])} style={{cursor:'pointer'}}/>
          <circle cx={cx} cy={cy} r={ri} fill="#fff" style={{pointerEvents:'none'}}/>
        </svg>
        <Tooltip tip={tip}/>
      </>
    );
  }

  let angle=-Math.PI/2;
  const paths=valid.map(seg=>{
    const frac=seg.value/total;
    const sa=angle,ea=angle+frac*2*Math.PI-0.02;
    angle=angle+frac*2*Math.PI;
    const co=(a,rr)=>cx+rr*Math.cos(a),si=(a,rr)=>cy+rr*Math.sin(a);
    const lg=frac>.5?1:0;
    return{...seg,d:`M${co(sa,r)},${si(sa,r)}A${r},${r} 0 ${lg},1 ${co(ea,r)},${si(ea,r)}L${co(ea,ri)},${si(ea,ri)}A${ri},${ri} 0 ${lg},0 ${co(sa,ri)},${si(sa,ri)}Z`};
  });

  return(
    <>
      <svg viewBox={`0 0 ${size} ${size}`} style={{width:size,height:size,display:'block',flexShrink:0}}
        onMouseMove={moveTip} onMouseLeave={hideTip}>
        {paths.map((p,i)=>(
          <path key={i} d={p.d} fill={p.color} stroke="#fff" strokeWidth={2.5}
            style={{cursor:'pointer',transition:'opacity .12s'}}
            onMouseEnter={e=>showTip(e,p)}/>
        ))}
      </svg>
      <Tooltip tip={tip}/>
    </>
  );
}

function AreaLineChart({data}){
  const dark=useDark();
  const gridCol=dark?'#2A2820':'#F0EDE6';
  const tickCol=dark?'#4A4840':'#C0BDB4';
  const crossCol=dark?'#3A3828':'#C0BDB4';
  const dotStroke=dark?'#18170F':'#fff';
  const labelCol=dark?'#4A4840':'#B0ADA4';
  const labelHovCol=dark?'#A8A59C':'#555';

  const W=520,H=164,pl=58,pr=14,pt=10,pb=32;
  const iw=W-pl-pr,ih=H-pt-pb;
  const n=data.length;
  const [tip,setTip]=useState(null);
  const [hoverIdx,setHoverIdx]=useState(null);
  const svgRef=useRef();

  if(n<2)return <div style={{height:H,display:'flex',alignItems:'center',justifyContent:'center',color:dark?'#4A4840':'#B0ADA4',fontSize:13}}>Insufficient data</div>;
  const maxV=Math.max(...data.flatMap(d=>[d.revenue||0,d.profit||0]),1);
  const xp=i=>pl+i*(iw/(n-1));
  const yp=v=>pt+ih*(1-Math.max(v,0)/maxV);
  const lp=key=>data.map((d,i)=>`${i===0?'M':'L'}${xp(i).toFixed(1)},${yp(d[key]||0).toFixed(1)}`).join(' ');
  const ap=key=>{const bot=pt+ih;return lp(key)+` L${xp(n-1).toFixed(1)},${bot} L${xp(0).toFixed(1)},${bot}Z`;};
  const ticks=Array.from({length:5},(_,i)=>maxV*(i/4));

  const onSvgMove=e=>{
    const svg=svgRef.current;if(!svg)return;
    const rect=svg.getBoundingClientRect();
    const scaleX=W/rect.width;
    const mouseX=(e.clientX-rect.left)*scaleX;
    let best=0,bestDist=Infinity;
    data.forEach((_,i)=>{const d=Math.abs(xp(i)-mouseX);if(d<bestDist){bestDist=d;best=i;}});
    const d=data[best];
    const margin=d.revenue>0?Math.round((d.profit/d.revenue)*100):0;
    setHoverIdx(best);
    setTip({x:e.clientX,y:e.clientY,content:(
      <div>
        <div style={{fontWeight:700,marginBottom:6,fontSize:12.5,borderBottom:'1px solid rgba(255,255,255,.12)',paddingBottom:5}}>{d.label||d.month} — {d.orders||0} order{d.orders!==1?'s':''}</div>
        <TRow label="Revenue" value={fmtM(d.revenue||0)} color="#F59E0B"/>
        <TRow label="Gross Profit" value={fmtM(d.profit||0)} color="#059669"/>
        <TRow label="Margin" value={`${margin}%`}/>
      </div>
    )});
  };
  const onSvgLeave=()=>{setTip(null);setHoverIdx(null);};

  return(
    <>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block',cursor:'crosshair'}}
        onMouseMove={onSvgMove} onMouseLeave={onSvgLeave}>
        <defs>
          <linearGradient id="gRev" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#F59E0B" stopOpacity={dark?'.35':'.22'}/><stop offset="100%" stopColor="#F59E0B" stopOpacity="0"/></linearGradient>
          <linearGradient id="gPro" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#059669" stopOpacity={dark?'.4':'.28'}/><stop offset="100%" stopColor="#059669" stopOpacity="0"/></linearGradient>
        </defs>
        {ticks.map((v,i)=>(
          <g key={i}>
            <line x1={pl} x2={W-pr} y1={yp(v)} y2={yp(v)} stroke={gridCol} strokeWidth={1}/>
            <text x={pl-8} y={yp(v)+4} textAnchor="end" fontSize={9} fill={tickCol}>
              {v>=1000?`$${(v/1000).toFixed(v>=10000?0:1)}k`:`$${Math.round(v)}`}
            </text>
          </g>
        ))}
        <path d={ap('revenue')} fill="url(#gRev)"/>
        <path d={ap('profit')} fill="url(#gPro)"/>
        <path d={lp('revenue')} fill="none" stroke="#F59E0B" strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
        <path d={lp('profit')} fill="none" stroke="#059669" strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
        {hoverIdx!==null&&(
          <line x1={xp(hoverIdx)} x2={xp(hoverIdx)} y1={pt} y2={pt+ih}
            stroke={crossCol} strokeWidth={1} strokeDasharray="3,3" style={{pointerEvents:'none'}}/>
        )}
        {data.map((d,i)=>{
          const isHov=hoverIdx===i;
          const lbl=d.label||d.month;
          return(
            <g key={i}>
              <circle cx={xp(i)} cy={yp(d.revenue||0)} r={isHov?5:3.5}
                fill="#F59E0B" stroke={dotStroke} strokeWidth={isHov?2:1.5}/>
              <circle cx={xp(i)} cy={yp(d.profit||0)} r={isHov?5:3.5}
                fill="#059669" stroke={dotStroke} strokeWidth={isHov?2:1.5}/>
              <text x={xp(i)} y={H-5} textAnchor="middle" fontSize={9} fill={isHov?labelHovCol:labelCol} fontWeight={isHov?600:400}>{lbl}</text>
            </g>
          );
        })}
      </svg>
      <Tooltip tip={tip}/>
    </>
  );
}

function HBars({items,max,extraTooltip}){

  const [tip,setTip]=useState(null);

  const showTip=(e,item,i)=>{

const BRAND_COLORS=['#F59E0B','#4338CA','#059669','#DC2626','#7C3AED','#0891B2','#DB2777','#D97706'];
const CAT_COLORS_MAP={tv:'#4338CA',blender:'#047857',refrigerator:'#1D4ED8',washing_machine:'#C2410C',microwave:'#9333EA',air_fryer:'#BE123C',drone:'#0D9488',air_conditioner:'#0369A1',speaker:'#B45309',iron:'#6D28D9',fan:'#0E7490',vacuum:'#B91C1C'};
const PAY_COLORS={cash:'#059669',card:'#4338CA',transfer:'#F59E0B'};

function DashboardPage({sales,products,purchaseOrders,customers,onNewSale}){
  const dark=useDark();
  const [kpiTip,setKpiTip]=useState(null);
  const [chartRange,setChartRange]=useState('6months');
  const done=useMemo(()=>sales.filter(s=>s.status==='completed'),[sales]);

  const monthlyData=useMemo(()=>{
    const now=new Date();
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      months.push({key,month:d.toLocaleDateString('en-US',{month:'short'}),label:d.toLocaleDateString('en-US',{month:'short'}),revenue:0,profit:0,orders:0});
    }
    done.forEach(s=>{
      const key=s.date.slice(0,7);
      const m=months.find(x=>x.key===key);
      if(m){
        const rev=s.subtotal-s.discountAmount;
        const cogs=s.items.reduce((sum,i)=>sum+i.cost*i.quantity,0);
        m.revenue+=rev;m.profit+=rev-cogs;m.orders++;
      }
    });
    return months;
  },[done]);

  const weeklyData=useMemo(()=>{
    const now=new Date();
    // Start of current week (Monday)
    const dow=now.getDay();
    const monday=new Date(now);
    monday.setDate(now.getDate()-((dow+6)%7));
    monday.setHours(0,0,0,0);
    const DAY_NAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const days=DAY_NAMES.map((_,i)=>{
      const d=new Date(monday);d.setDate(monday.getDate()+i);
      return{label:DAY_NAMES[i],dateStr:d.toDateString(),revenue:0,profit:0,orders:0,fullDate:d.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
    });
    done.forEach(s=>{
      const ds=new Date(s.date).toDateString();
      const day=days.find(d=>d.dateStr===ds);
      if(day){
        const rev=s.subtotal-s.discountAmount;
        const cogs=s.items.reduce((sum,i)=>sum+i.cost*i.quantity,0);
        day.revenue+=rev;day.profit+=rev-cogs;day.orders++;
      }
    });
    return days;
  },[done]);

  const chartData=chartRange==='week'?weeklyData:monthlyData;

  const metrics=useMemo(()=>{
    const rev=done.reduce((s,x)=>s+(x.subtotal-x.discountAmount),0);
    const cogs=done.reduce((s,x)=>s+x.items.reduce((ss,i)=>ss+i.cost*i.quantity,0),0);
    const profit=rev-cogs;
    return{rev,profit,margin:rev>0?profit/rev*100:0,aov:done.length?rev/done.length:0};
  },[done]);

  const potentialRevenue=useMemo(()=>products.reduce((s,p)=>s+totalRetailValue(p),0),[products]);
  const potentialCost=useMemo(()=>products.reduce((s,p)=>s+totalCostValue(p),0),[products]);
  const potentialProfit=potentialRevenue-potentialCost;
  const potentialMargin=potentialRevenue>0?(potentialProfit/potentialRevenue)*100:0;

  const brandData=useMemo(()=>{
    const map={};
    done.forEach(s=>s.items.forEach(i=>{map[i.productBrand]=(map[i.productBrand]||0)+i.price*i.quantity;}));
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([label,value])=>({label,value}));
  },[done]);

  const catData=useMemo(()=>{
    const map={};
    done.forEach(s=>s.items.forEach(i=>{map[i.category]=(map[i.category]||0)+i.price*i.quantity;}));
    return Object.entries(map).map(([c,v])=>({label:CAT_LABELS[c]||c,value:v,color:CAT_COLORS_MAP[c]||'#888'})).sort((a,b)=>b.value-a.value);
  },[done]);

  const payData=useMemo(()=>{
    const rev={},cnt={};
    done.forEach(s=>{
      rev[s.paymentMethod]=(rev[s.paymentMethod]||0)+(s.subtotal-s.discountAmount);
      cnt[s.paymentMethod]=(cnt[s.paymentMethod]||0)+1;
    });
    return Object.entries(cnt).filter(([,v])=>v>0).map(([k,v])=>({label:{cash:'Cash',card:'Card',transfer:'Transfer'}[k]||k,value:v,revenue:rev[k]||0,color:PAY_COLORS[k]||'#888'}));
  },[done]);

  const topProducts=useMemo(()=>{
    const map={};
    done.forEach(s=>s.items.forEach(i=>{
      const key=`${i.productBrand} ${i.productModel}`;
      if(!map[key])map[key]={label:key,revenue:0,units:0,profit:0};
      map[key].revenue+=i.price*i.quantity;
      map[key].profit+=(i.price-i.cost)*i.quantity;
      map[key].units+=i.quantity;
    }));
    return Object.values(map).sort((a,b)=>b.revenue-a.revenue).slice(0,7);
  },[done]);

  const invByCat=useMemo(()=>{
    const map={};
    products.forEach(p=>{
      if(!map[p.category])map[p.category]={label:CAT_LABELS[p.category],units:0,low:0,color:CAT_COLORS_MAP[p.category]||'#888'};
      map[p.category].units+=totalQty(p);
      if(isLowStock(p))map[p.category].low++;
    });
    return Object.values(map).sort((a,b)=>b.units-a.units);
  },[products]);

  const dayData=useMemo(()=>{
    const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const map={};DAYS.forEach(d=>{map[d]=0;});
    done.forEach(s=>{const d=DAYS[new Date(s.date).getDay()];map[d]+=(s.subtotal-s.discountAmount);});
    return DAYS.map(d=>({label:d,value:map[d],color:'#F59E0B'}));
  },[done]);

  const poSummary={draft:0,sent:0,received:0,cancelled:0};
  purchaseOrders.forEach(p=>{poSummary[p.status]=(poSummary[p.status]||0)+1;});
  const committedPO=purchaseOrders.filter(p=>['draft','sent'].includes(p.status)).reduce((s,p)=>s+p.grandTotal,0);
  const receivedPOValue=purchaseOrders.filter(p=>p.status==='received').reduce((s,p)=>s+p.grandTotal,0);
  const lowStockItems=products.filter(isLowStock).slice(0,6);
  const totalRev=metrics.rev;

  const KPIs=[
    {icon:'💰',val:`$${Math.round(metrics.rev).toLocaleString()}`,lbl:'Total Revenue',sub:`${done.length} completed orders`,c:'#059669',
     tip:`All-time revenue from ${done.length} completed sale${done.length!==1?'s':''}.\nExcludes tax and voided orders.`},
    {icon:'📈',val:`$${Math.round(metrics.profit).toLocaleString()}`,lbl:'Gross Profit',sub:'After cost of goods',c:'#F59E0B',
     tip:`Revenue minus cost of goods sold.\nRevenue: ${fmtM(metrics.rev)}\nCOGS: ${fmtM(metrics.rev-metrics.profit)}`},
    {icon:'🎯',val:`${metrics.margin.toFixed(1)}%`,lbl:'Profit Margin',sub:'Gross margin rate',c:metrics.margin>=30?'#059669':metrics.margin>=15?'#D97706':'#DC2626',
     tip:'Gross Profit ÷ Revenue.\n'+(metrics.margin>=30?'✅ Healthy margin':metrics.margin>=15?'⚠ Watch margin':'🔴 Low margin — review pricing')},
    {icon:'🏷',val:`$${Math.round(potentialRevenue).toLocaleString()}`,lbl:'Potential Revenue',sub:'Current inventory × price',c:'#4338CA',
     tip:`Total retail value of all stock on hand.\nInventory units × sale price per variant.\n\nRetail value: ${fmtM(potentialRevenue)}\nInventory cost: ${fmtM(potentialCost)}`},
    {icon:'💎',val:`$${Math.round(potentialProfit).toLocaleString()}`,lbl:'Potential Profit',sub:'If all stock sold',c:potentialMargin>=30?'#059669':potentialMargin>=15?'#D97706':'#DC2626',
     tip:`Gross profit if all current inventory sells.\nRetail value: ${fmtM(potentialRevenue)}\nStock cost: ${fmtM(potentialCost)}\nMargin: ${potentialMargin.toFixed(1)}%`},
  ];

  return(
    <>
      <div className="topbar">
        <div className="topbar-title">Dashboard</div>
        <div style={{flex:1,paddingLeft:12}}><span style={{fontSize:12,color:'#B0ADA4'}}>All time · {done.length} completed sales</span></div>
        <div className="topbar-actions"><button className="btn-sale" onClick={onNewSale}>+ New Sale</button></div>
      </div>
      <div className="db-content">

        {/* KPIs */}
        <div className="db-kpis">
          {KPIs.map((k,i)=>(
            <div key={i} className="kpi-card" style={{cursor:'help',position:'relative'}}
              onMouseEnter={e=>setKpiTip({x:e.clientX,y:e.clientY,content:<div style={{whiteSpace:'pre-line',fontSize:12,lineHeight:1.6}}>{k.tip}</div>})}
              onMouseMove={e=>setKpiTip(t=>t?{...t,x:e.clientX,y:e.clientY}:t)}
              onMouseLeave={()=>setKpiTip(null)}>
              <div className="kpi-icon">{k.icon}</div>
              <div className="kpi-val" style={{color:k.c}}>{k.val}</div>
              <div className="kpi-lbl">{k.lbl}</div>
              <div className="kpi-sub">{k.sub}</div>
            </div>
          ))}
        </div>
        <Tooltip tip={kpiTip}/>

        {/* Revenue & Profit chart | Category Donut */}
        <div className="db-grid-2">
          <div className="db-card">
            <div className="db-card-hd">
              <span>Revenue &amp; Gross Profit</span>
              <div style={{display:'flex',alignItems:'center',gap:14}}>
                <div style={{display:'flex',gap:12,fontSize:11,color:dark?'#706D66':'#888'}}>
                  <span><b style={{color:'#F59E0B'}}>●</b> Revenue</span>
                  <span><b style={{color:'#059669'}}>●</b> Gross Profit</span>
                </div>
                <div style={{display:'flex',border:`1px solid ${dark?'#2A2820':'#E8E6E0'}`,borderRadius:6,overflow:'hidden'}}>
                  {[{id:'week',label:'This Week'},{id:'6months',label:'6 Months'}].map(o=>(
                    <button key={o.id}
                      onClick={()=>setChartRange(o.id)}
                      style={{background:chartRange===o.id?(dark?'#EAE8E1':'#111'):'transparent',color:chartRange===o.id?(dark?'#111':'#fff'):(dark?'#706D66':'#888'),border:'none',padding:'4px 10px',fontSize:11,cursor:'pointer',fontFamily:'inherit',fontWeight:chartRange===o.id?600:400,transition:'all .12s'}}>
                      {o.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
            <div style={{padding:'10px 12px 6px'}}><AreaLineChart data={chartData}/></div>
          </div>
          <div className="db-card">
            <div className="db-card-hd"><span>Revenue by Category</span></div>
            <div className="db-card-body" style={{display:'flex',alignItems:'center',gap:18}}>
              <DonutChart segments={catData} size={128}/>
              <div className="seg-legend" style={{flex:1}}>
                {catData.map((s,i)=>(
                  <div key={i} className="seg-item">
                    <div className="seg-dot" style={{background:s.color}}/>
                    <div className="seg-lbl">{s.label}</div>
                    <div className="seg-pct">{totalRev>0?Math.round(s.value/totalRev*100):0}%</div>
                  </div>
                ))}
                {!catData.length&&<div style={{fontSize:12,color:'#B0ADA4'}}>No sales yet</div>}
              </div>
            </div>
          </div>
        </div>

        {/* Top Brands | Payment Methods | Inventory */}
        <div className="db-grid-3">
          <div className="db-card">
            <div className="db-card-hd"><span>Top Brands by Revenue</span><span style={{fontSize:11,color:'#B0ADA4'}}>{brandData.length} brands</span></div>
            <div className="db-card-body">
              {brandData.length?<HBars
                items={brandData.map((b,i)=>({...b,color:BRAND_COLORS[i%BRAND_COLORS.length],valueLabel:'Revenue'}))}
                max={brandData[0]?.value}
                extraTooltip={item=>{
                  const totalB=brandData.reduce((s,x)=>s+x.value,0);
                  const pct=totalB>0?Math.round(item.value/totalB*100):0;
                  return <TRow label="Market share" value={`${pct}%`}/>;
                }}
              />:<div className="db-empty">No sales data yet</div>}
            </div>
          </div>
          <div className="db-card">
            <div className="db-card-hd"><span>Payment Methods</span></div>
            <div className="db-card-body" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
              <DonutChart segments={payData} size={118}/>
              <div className="seg-legend" style={{width:'100%'}}>
                {payData.map((s,i)=>(
                  <div key={i} className="seg-item">
                    <div className="seg-dot" style={{background:s.color}}/>
                    <div className="seg-lbl">{s.label}</div>
                    <div style={{fontSize:11,fontFamily:"'IBM Plex Mono',monospace",color:'#888'}}>{s.value} sale{s.value!==1?'s':''}</div>
                    <div style={{fontSize:11,fontFamily:"'IBM Plex Mono',monospace",color:'#555',fontWeight:600,marginLeft:4}}>{fmtShort(s.revenue)}</div>
                  </div>
                ))}
                {!payData.length&&<div className="db-empty">No data</div>}
              </div>
            </div>
          </div>
          <div className="db-card">
            <div className="db-card-hd"><span>Units in Stock</span></div>
            <div className="db-card-body">
              <HBars
                items={invByCat.map(c=>({label:c.label,value:c.units,color:c.color,formatted:`${c.units} units`,valueLabel:'Units in stock'}))}
                max={Math.max(...invByCat.map(c=>c.units),1)}
                extraTooltip={(_item,i)=>{
                  const cat=invByCat[i];
                  return cat?.low>0?<TRow label="Low stock" value={`${cat.low} product${cat.low!==1?'s':''}`}/>:null;
                }}
              />
              {invByCat.some(c=>c.low>0)&&<div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #F5F3EF',fontSize:11,color:'#DC2626',fontWeight:500}}>
                ⚠ {invByCat.reduce((s,c)=>s+c.low,0)} low-stock product{invByCat.reduce((s,c)=>s+c.low,0)!==1?'s':''}
              </div>}
            </div>
          </div>
        </div>

        {/* Top Products Table | Revenue by Day + PO + Low Stock */}
        <div className="db-grid-bottom">
          <div className="db-card">
            <div className="db-card-hd"><span>Top Products by Revenue</span></div>
            <div className="db-card-body">
              <TopProductsTable topProducts={topProducts}/>
            </div>
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {/* Sales by Day of Week */}
            <div className="db-card">
              <div className="db-card-hd"><span>Revenue by Day of Week</span></div>
              <div className="db-card-body">
                {dayData.some(d=>d.value>0)?<HBars
                  items={dayData}
                  max={Math.max(...dayData.map(d=>d.value),1)}
                  extraTooltip={item=>{
                    const best=item.value===Math.max(...dayData.map(d=>d.value))&&item.value>0;
                    return best?<div style={{fontSize:10,color:'#F59E0B',marginTop:3,fontWeight:600}}>⭐ Best performing day</div>:null;
                  }}
                />:<div className="db-empty">No data yet</div>}
              </div>
            </div>

            {/* PO Summary */}
            <div className="db-card">
              <div className="db-card-hd"><span>Purchase Orders</span><span style={{fontSize:11,color:'#B0ADA4'}}>{purchaseOrders.length} total</span></div>
              <div className="db-card-body">
                {[{lbl:'Draft',k:'draft',c:'#888'},{lbl:'In Transit',k:'sent',c:'#1D4ED8'},{lbl:'Received',k:'received',c:'#047857'},{lbl:'Cancelled',k:'cancelled',c:'#DC2626'}].map(({lbl,k,c})=>(
                  <div key={k} className="po-stat-row" style={{fontSize:12.5}}>
                    <span style={{color:'#666'}}>{lbl}</span>
                    <span style={{fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",color:c}}>{poSummary[k]||0}</span>
                  </div>
                ))}
                <div style={{display:'flex',justifyContent:'space-between',marginTop:8,paddingTop:8,borderTop:'1px solid #F0EDE6',fontSize:12}}>
                  <span style={{color:'#888'}}>Open commitment</span>
                  <span style={{fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>{fmtShort(committedPO)}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:12}}>
                  <span style={{color:'#888'}}>Total received</span>
                  <span style={{fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",color:'#047857'}}>{fmtShort(receivedPOValue)}</span>
                </div>
              </div>
            </div>

            {/* Low Stock */}
            <div className="db-card">
              <div className="db-card-hd">
                <span>Low Stock Alerts</span>
                {lowStockItems.length>0?<span style={{fontSize:11,color:'#DC2626',fontWeight:700,background:'#FEF2F2',padding:'2px 8px',borderRadius:20}}>{lowStockItems.length}</span>:<span style={{fontSize:11,color:'#047857',fontWeight:600}}>All good ✓</span>}
              </div>
              <div className="db-card-body">
                {lowStockItems.length?lowStockItems.map((p,i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid #F8F7F4',fontSize:12}}>
                    <div>
                      <div style={{fontWeight:500,color:'#111'}}>{p.brand} {p.model}</div>
                      <div style={{fontSize:10.5,color:'#B0ADA4',marginTop:1}}>{CAT_LABELS[p.category]}</div>
                    </div>
                    <span style={{fontFamily:"'IBM Plex Mono',monospace",color:'#DC2626',fontWeight:700,flexShrink:0}}>{totalQty(p)} left</span>
                  </div>
                )):<div style={{fontSize:13,color:'#B0ADA4',textAlign:'center',padding:'12px 0'}}>All products sufficiently stocked</div>}
              </div>
            </div>
          </div>
        </div>

      </div>
    </>
  );
}

/* ─── App Root ───────────────────────────────────────────────── */
/* ─── Quotes Page (Cotizaciones) ────────────────────────────── */
function QuotesPage({quotes,onNewQuote,onConvert,onUpdateQuote,toast}){
  const [q,setQ]=useState('');const [sf,setSf]=useState('all');const [detail,setDetail]=useState(null);
  const filtered=useMemo(()=>{
    let list=[...quotes];
    if(sf!=='all')list=list.filter(x=>x.status===sf);
    if(q.trim()){const s=q.toLowerCase();list=list.filter(x=>x.customer.name.toLowerCase().includes(s)||quoteNum(x.quoteNumber).toLowerCase().includes(s));}
    return list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  },[quotes,q,sf]);
  const stCls={draft:'sb-pending',sent:'sb-completed',accepted:'sb-completed',expired:'sb-void',converted:'sb-completed'};
  return(<>
    <div className="topbar"><div className="topbar-title">Cotizaciones</div>
      <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-input" placeholder="Search quotes…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="topbar-actions">
        <div className="filter-tabs">{['all','draft','sent','accepted','expired','converted'].map(s=><button key={s} className={`f-tab${sf===s?' active':''}`} onClick={()=>setSf(s)}>{s.charAt(0).toUpperCase()+s.slice(1)}</button>)}</div>
        <button className="btn-sale" onClick={onNewQuote}>+ New Quote</button>
      </div>
    </div>
    <div className="stats-strip">
      <div className="stat-cell"><div className="stat-lbl">Total Quotes</div><div className="stat-val">{quotes.length}</div></div>
      <div className="stat-cell"><div className="stat-lbl">Drafts</div><div className="stat-val">{quotes.filter(x=>x.status==='draft').length}</div></div>
      <div className="stat-cell"><div className="stat-lbl">Sent</div><div className="stat-val">{quotes.filter(x=>x.status==='sent').length}</div></div>
      <div className="stat-cell"><div className="stat-lbl">Total Value</div><div className="stat-val money"><span className="money-sym">$</span>{Math.round(quotes.filter(x=>x.status!=='expired'&&x.status!=='converted').reduce((s,x)=>s+x.total,0)).toLocaleString()}</div></div>
    </div>
    <div className="content">
      {!filtered.length?<div className="empty"><div className="empty-icon">📝</div><div className="empty-h">No quotes yet</div><div className="empty-p">Create your first quote</div></div>
      :filtered.map(qt=><div key={qt.id} className="sale-card" onClick={()=>setDetail(qt)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <span style={{fontWeight:700,fontSize:14}}>{quoteNum(qt.quoteNumber)}</span>
          <span className={`status-badge ${stCls[qt.status]||''}`}>{qt.status}</span>
        </div>
        <div style={{fontSize:13,fontWeight:500}}>{qt.customer.name}</div>
        <div style={{fontSize:11,color:'#B0ADA4',marginTop:2}}>{fmtDate(qt.date)} · Expires {fmtDate(qt.expiresAt)}</div>
        <div style={{fontSize:11,color:'#B0ADA4'}}>{qt.items.length} item{qt.items.length!==1?'s':''}</div>
        <div style={{fontSize:16,fontWeight:700,marginTop:8}}>{fmtM(qt.total)}</div>
      </div>)}
    </div>
    {detail&&(()=>{const c=detail.customer;return <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setDetail(null)}}>
      <div className="sale-dtl">
        <div className="modal-head">
          <div>
            <div className="modal-title">{quoteNum(detail.quoteNumber)}</div>
            <div style={{fontSize:12,color:'#B0ADA4',marginTop:2}}>{fmtDate(detail.date)} · Expires {fmtDate(detail.expiresAt)}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span className={`status-badge ${stCls[detail.status]||''}`}>{detail.status}</span>
            <button className="btn-x" onClick={()=>setDetail(null)}>×</button>
          </div>
        </div>
        <div className="modal-body">
          {/* Print-only business header */}
          <div className="print-biz-header receipt-biz" style={{marginBottom:16}}>
            <div className="receipt-biz-icon">SL</div>
            <div>
              <div className="receipt-biz-name"><span>Smart</span>Living <small style={{fontSize:10,letterSpacing:2,color:'#B0ADA4',textTransform:'uppercase',fontWeight:600}}>Home</small></div>
              <div className="receipt-biz-tagline">Compra Smart, Vive Smart</div>
            </div>
          </div>
          {/* Customer */}
          <div className="sd-section" style={{background:'#F8F7F4',borderRadius:10,padding:'14px 16px',marginBottom:16,display:'flex',gap:14,alignItems:'flex-start'}}>
            <div style={{width:40,height:40,borderRadius:'50%',background:'#E8E6E0',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,color:'#777',fontSize:15,flexShrink:0}}>{initials(c.name||'?')}</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="sd-name" style={{fontSize:15,fontWeight:600,color:'#111',marginBottom:6}}>{c.name||'Customer'}</div>
              <div className="sd-detail" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 16px',fontSize:12,color:'#666'}}>
                {c.phone&&<div><span style={{color:'#B0ADA4'}}>Phone </span>{c.phone}</div>}
                {c.email&&<div><span style={{color:'#B0ADA4'}}>Email </span>{c.email}</div>}
                {c.line1&&<div style={{gridColumn:'1/-1'}}><span style={{color:'#B0ADA4'}}>Address </span>{[c.line1,c.line2].filter(Boolean).join(', ')}</div>}
                {c.city&&<div><span style={{color:'#B0ADA4'}}>City </span>{[c.sector,c.city].filter(Boolean).join(', ')}</div>}
                {c.reference&&<div style={{gridColumn:'1/-1'}}><span style={{color:'#B0ADA4'}}>Reference </span>{c.reference}</div>}
                {c.note&&<div className="sd-pay" style={{gridColumn:'1/-1',background:'#fff',borderRadius:6,padding:'6px 10px',border:'1px solid #E8E6E0',color:'#888',marginTop:4}}>{c.note}</div>}
              </div>
            </div>
          </div>
          {/* Items */}
          <div className="sd-section" style={{border:'1px solid #E8E6E0',borderRadius:10,overflow:'hidden',marginBottom:16}}>
            <div className="sd-section" style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',gap:'0 12px',padding:'8px 14px',background:'#F8F7F4',fontSize:10,textTransform:'uppercase',letterSpacing:'.5px',color:'#B0ADA4',fontWeight:500}}>
              <span>Product</span><span style={{textAlign:'right'}}>Unit</span><span style={{textAlign:'center'}}>Qty</span><span style={{textAlign:'right'}}>Total</span>
            </div>
            {detail.items.map((item,i)=>(
              <div key={item.key} className="sd-divider" style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',gap:'0 12px',padding:'10px 14px',borderTop:i>0?'1px solid #F8F7F4':'none',alignItems:'center'}}>
                <div>

          {(detail.status==='draft'||detail.status==='sent')&&<button className="btn-primary" style={{background:'#059669'}} onClick={()=>{onConvert(detail);setDetail(null);}}>🔄 Convert to Sale</button>}
          {(detail.status==='draft'||detail.status==='sent')&&<button className="btn-danger" style={{marginRight:'auto'}} onClick={()=>{onUpdateQuote(detail.id,{status:'expired'});setDetail(d=>({...d,status:'expired'}));toast('Quote expired',{type:'warning'});}}>Mark Expired</button>}
          {c.phone&&<button onClick={()=>{window.print();setTimeout(()=>{const waText=['*SmartLiving Home*','_Compra Smart, Vive Smart_','','Hola '+(c.name||'').split(' ')[0]+'!','','Le adjuntamos su cotizacion:','','*Cotizacion:* '+quoteNum(detail.quoteNumber),'*Total:* '+fmtM(detail.total),'*Fecha:* '+fmtDate(detail.date),'*Expira:* '+fmtDate(detail.expiresAt),'','_La cotizacion en PDF fue guardada, por favor adjuntela a esta conversacion._','','Gracias por su preferencia!','SmartLiving Home'].join('\n');window.open(waLink(c.phone,waText),'_blank');},1500);}} style={{display:'inline-flex',alignItems:'center',gap:4,padding:'6px 14px',background:'#25D366',color:'#fff',borderRadius:8,fontSize:12,fontWeight:500,border:'none',cursor:'pointer'}}>WhatsApp + PDF</button>}
          <button className="btn-secondary" onClick={()=>window.print()}>🖨 Print</button>
          <button className="btn-primary" onClick={()=>setDetail(null)}>Close</button>
        </div>
      </div>
    </div>})()}
  </>);
}

/* ─── New Quote Overlay ─────────────────────────────────────── */
function NewQuoteOverlay({products,customers,quotes,onClose,onSave}){
  const [custQ,setCustQ]=useState('');const [showDrop,setShowDrop]=useState(false);const [cust,setCust]=useState({...EMPTY_CUST});
  const [showAllFields,setShowAllFields]=useState(false);const [prodQ,setProdQ]=useState('');const [prodCat,setProdCat]=useState('all');
  const [selVars,setSelVars]=useState({});const [selQtys,setSelQtys]=useState({});const [cart,setCart]=useState([]);
  const [discType,setDiscType]=useState('percent');const [discVal,setDiscVal]=useState('');const [taxOn,setTaxOn]=useState(true);const [taxRate,setTaxRate]=useState(18);
  const [qNote,setQNote]=useState('');const [expDays,setExpDays]=useState(15);
  const custSugs=useMemo(()=>{if(!custQ.trim())return[];const s=custQ.toLowerCase();return customers.filter(c=>c.name.toLowerCase().includes(s)||c.phone.includes(s)).slice(0,6);},[custQ,customers]);
  const pickCust=c=>{setCust({...c});setCustQ(c.name);setShowDrop(false);setShowAllFields(true);};
  const ppFiltered=useMemo(()=>{let list=prodCat==='all'?products:products.filter(p=>p.category===prodCat);if(prodQ.trim()){const s=prodQ.toLowerCase();list=list.filter(p=>p.brand.toLowerCase().includes(s)||p.model.toLowerCase().includes(s)||(p.sku||'').toLowerCase().includes(s));}return list;},[products,prodCat,prodQ]);
  const getSelV=p=>{const vid=selVars[p.id]||p.variants[0]?.id;return p.variants.find(v=>v.id===vid)||p.variants[0];};
  const addToCart=p=>{const v=getSelV(p);if(!v)return;const qty=Math.max(1,Number(selQtys[p.id]||1));const key=`${p.id}__${v.id}`;
    setCart(items=>{const ex=items.find(i=>i.key===key);if(ex)return items.map(i=>i.key===key?{...i,quantity:i.quantity+qty}:i);return[...items,{key,productId:p.id,variantId:v.id,productBrand:p.brand,productModel:p.model,productSku:p.sku||'',variantName:v.name,category:p.category,cost:v.cost,price:v.price,quantity:qty}];});};
  const rmCI=key=>setCart(items=>items.filter(i=>i.key!==key));
  const subtotal=cart.reduce((s,i)=>s+(i.price*i.quantity),0);
  const discAmt=Number(discVal)>0?(discType==='percent'?subtotal*(Number(discVal)/100):Math.min(Number(discVal),subtotal)):0;
  const taxable=subtotal-discAmt;const taxAmt=taxOn?taxable*(taxRate/100):0;const total=taxable+taxAmt;
  const save=()=>{
    if(!cust.name.trim())return alert('Customer name required');if(!cart.length)return alert('Add items');
    const now=new Date();const exp=new Date(now);exp.setDate(exp.getDate()+expDays);
    onSave({id:uid(),quoteNumber:quotes.length+1,date:now.toISOString(),expiresAt:exp.toISOString(),customer:{...cust,id:cust.id||uid()},items:cart,subtotal,discountType:discType,discountValue:Number(discVal)||0,discountAmount:discAmt,taxRate:taxOn?taxRate:0,taxAmount:taxAmt,total,status:'draft',convertedSaleId:null,notes:qNote});
    onClose();
  };
  return(<div className="sale-overlay">
    <div className="sale-hdr">
      <div className="sale-hdr-num">New Quote {quoteNum(quotes.length+1)}</div><div className="sale-hdr-sep">|</div>
      <div className="sale-hdr-cust">Customer: <b>{cust.name.trim()||'—'}</b></div>
      <button className="btn-cancel-sale" onClick={onClose}>✕ Cancel</button>
      <button className="btn-complete" onClick={save} disabled={!cust.name.trim()||!cart.length}>💾 Save Quote{total>0?` · ${fmtM(total)}`:''}</button>
    </div>
    <div className="sale-body">
      <div className="sale-left">
        <div className="sale-section"><div className="sale-sec-head"><div className="sale-sec-title"><span className="sec-num">1</span> Customer</div></div>
          <div className="sale-sec-body">
            <div className="cust-search-wrap"><input className="cust-search-input" placeholder="🔍 Search customer…" value={custQ} onChange={e=>{setCustQ(e.target.value);setCust(c=>({...c,name:e.target.value,id:null}));setShowDrop(true);}} onFocus={()=>custQ.trim()&&setShowDrop(true)} onBlur={()=>setTimeout(()=>setShowDrop(false),180)}/>
              {showDrop&&custSugs.length>0&&<div className="cust-drop">{custSugs.map(c=><div key={c.id} className="cust-drop-item" onMouseDown={()=>pickCust(c)}><div className="cust-avatar">{initials(c.name)}</div><div><div className="cust-drop-name">{c.name}</div><div className="cust-drop-sub">{c.phone}</div></div></div>)}</div>}
            </div>
            <div className="cust-form-grid">
              <div className="cg span2"><label>Full Name *</label><input value={cust.name} onChange={e=>setCust(c=>({...c,name:e.target.value}))}/></div>
              <div className="cg"><label>Phone</label><input value={cust.phone} onChange={e=>setCust(c=>({...c,phone:e.target.value}))}/></div>
              <div className="cg"><label>Email</label><input value={cust.email} onChange={e=>setCust(c=>({...c,email:e.target.value}))}/></div>
            </div>
            <div style={{marginTop:10}}><label style={{fontSize:12,color:'#888'}}>Expires in (days)</label><input type="number" min="1" value={expDays} onChange={e=>setExpDays(Number(e.target.value)||15)} style={{width:80,marginLeft:8,padding:'4px 8px',borderRadius:6,border:'1px solid #E8E6E0',fontSize:13}}/></div>
          </div>
        </div>
        <div className="sale-section"><div className="sale-sec-head"><div className="sale-sec-title"><span className="sec-num">2</span> Products</div></div>
          <div className="sale-sec-body">
            <div className="pp-bar"><div className="pp-sw"><span className="pp-sw-icon">🔍</span><input className="pp-search" placeholder="Search…" value={prodQ} onChange={e=>setProdQ(e.target.value)}/></div></div>
            <div className="cat-tabs">{CATS.map(c=><button key={c.id} className={`cat-tab${prodCat===c.id?' active':''}`} onClick={()=>setProdCat(c.id)}>{c.label}</button>)}</div>
            <div className="pp-results">{ppFiltered.map(p=>{const sv=getSelV(p);return(<div key={p.id} className="pp-row"><div className="pp-img">📦</div><div className="pp-info"><div className="pp-name">{p.brand} {p.model}</div></div>
              <div className="pp-ctl"><select className="pp-sel" value={selVars[p.id]||p.variants[0]?.id||''} onChange={e=>setSelVars(sv=>({...sv,[p.id]:e.target.value}))}>{p.variants.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}</select>
              <div className="pp-price">{sv?.price>0?fmtShort(sv.price):'—'}</div>
              <div className="stepper"><button onClick={()=>setSelQtys(q=>({...q,[p.id]:Math.max(1,(Number(q[p.id]||1)-1))}))}>−</button><input type="number" min="1" value={selQtys[p.id]||1} onChange={e=>setSelQtys(q=>({...q,[p.id]:e.target.value}))}/><button onClick={()=>setSelQtys(q=>({...q,[p.id]:(Number(q[p.id]||1)+1)}))}>+</button></div>
              <button className="btn-add-cart" onClick={()=>addToCart(p)}>Add</button></div></div>);})}</div>
          </div>
        </div>
      </div>
      <div className="sale-right">
        <div className="cart-hd"><div className="cart-hd-title">Quote Summary {cart.length>0&&<span className="cart-badge">{cart.reduce((s,i)=>s+i.quantity,0)} items</span>}</div></div>
        {!cart.length?<div className="cart-empty-state"><div className="cart-empty-icon">📝</div><div style={{fontSize:13}}>No items added</div></div>
        :<div className="cart-items-wrap">{cart.map(item=><div key={item.key} className="ci"><div className="ci-info"><div className="ci-name">{item.productBrand} {item.productModel}</div><div className="ci-var">{item.variantName} · {fmtShort(item.price)}</div><div className="ci-linetotal">{fmtM(item.price*item.quantity)}</div></div><button className="ci-rm" onClick={()=>rmCI(item.key)}>×</button></div>)}</div>}
        <div className="ot-wrap">
          <div className="ot-row"><span className="ot-lbl">Subtotal</span><span className="ot-val">{fmtM(subtotal)}</span></div>
          <div style={{marginBottom:8}}><div style={{fontSize:10,fontWeight:500,textTransform:'uppercase',letterSpacing:'.5px',color:'#A8A59C',marginBottom:6}}>Discount</div>
            <div className="disc-row"><div className="disc-toggle"><button className={`dt-btn${discType==='percent'?' active':''}`} onClick={()=>setDiscType('percent')}>%</button><button className={`dt-btn${discType==='fixed'?' active':''}`} onClick={()=>setDiscType('fixed')}>$</button></div><input className="disc-input" type="number" min="0" value={discVal} onChange={e=>setDiscVal(e.target.value)}/></div>
          </div>
          <div className="tax-row"><div className="sw-wrap" onClick={()=>setTaxOn(t=>!t)}><div className={`sw${taxOn?' on':''}`}/><span style={{fontSize:13,color:'#666'}}>ITBIS</span></div>
            <div style={{display:'flex',alignItems:'center',gap:5}}><input className="tax-rate" type="number" min="0" max="100" value={taxRate} onChange={e=>setTaxRate(Number(e.target.value)||0)} disabled={!taxOn}/><span style={{fontSize:12,color:'#B0ADA4'}}>%</span></div>
          </div>
          <hr className="ot-hr"/><div className="ot-total"><span className="ot-total-lbl">Total</span><span className="ot-total-val">{fmtM(total)}</span></div>
        </div>
        <div className="note-wrap"><div className="pay-lbl-title">Quote Note</div><textarea className="note-ta" placeholder="Notes…" value={qNote} onChange={e=>setQNote(e.target.value)}/></div>
        <div className="sale-footer"><button className="btn-complete" style={{width:'100%',justifyContent:'center'}} onClick={save} disabled={!cust.name.trim()||!cart.length}>💾 Save Quote{total>0?` · ${fmtM(total)}`:''}</button></div>
      </div>
    </div>
  </div>);
}

/* ─── Returns Page (Devoluciones) ───────────────────────────── */
function ReturnsPage({returns,sales,onCreateReturn,toast}){
  const [q,setQ]=useState('');const [sf,setSf]=useState('all');const [detail,setDetail]=useState(null);const [createFrom,setCreateFrom]=useState(null);
  const [selItems,setSelItems]=useState({});const [reason,setReason]=useState('defective');const [retType,setRetType]=useState('refund');const [retNote,setRetNote]=useState('');
  const filtered=useMemo(()=>{let list=[...returns];if(sf!=='all')list=list.filter(r=>r.status===sf);if(q.trim()){const s=q.toLowerCase();list=list.filter(r=>r.customer.name.toLowerCase().includes(s)||returnNum(r.returnNumber).toLowerCase().includes(s));}return list.sort((a,b)=>new Date(b.date)-new Date(a.date));},[returns,q,sf]);
  const eligibleSales=sales.filter(s=>s.status==='completed');
  const startReturn=sale=>{setCreateFrom(sale);setSelItems({});setReason('defective');setRetType('refund');setRetNote('');};
  const submitReturn=()=>{
    const items=Object.entries(selItems).filter(([,qty])=>qty>0).map(([key,qty])=>{const item=createFrom.items.find(i=>i.key===key);return{...item,returnQty:qty,reason};});
    if(!items.length)return alert('Select items to return');
    const refundAmount=items.reduce((s,i)=>s+(i.price*i.returnQty),0);
    onCreateReturn({id:uid(),returnNumber:returns.length+1,date:new Date().toISOString(),originalSaleId:createFrom.id,originalSaleNumber:createFrom.saleNumber,customer:createFrom.customer,items,type:retType,refundAmount,status:'completed',notes:retNote});
    setCreateFrom(null);
  };
  return(<>
    <div className="topbar"><div className="topbar-title">Devoluciones</div>
      <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-input" placeholder="Search returns…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="topbar-actions"><div className="filter-tabs">{['all','pending','completed'].map(s=><button key={s} className={`f-tab${sf===s?' active':''}`} onClick={()=>setSf(s)}>{s.charAt(0).toUpperCase()+s.slice(1)}</button>)}</div></div>
    </div>
    <div className="stats-strip">
      <div className="stat-cell"><div className="stat-lbl">Total Returns</div><div className="stat-val">{returns.length}</div></div>
      <div className="stat-cell"><div className="stat-lbl">Total Refunded</div><div className="stat-val money"><span className="money-sym">$</span>{Math.round(returns.reduce((s,r)=>s+r.refundAmount,0)).toLocaleString()}</div></div>
    </div>
    <div className="content">
      <div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Create Return from Sale</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{eligibleSales.slice(0,10).map(s=><button key={s.id} className="btn-secondary" style={{fontSize:11}} onClick={()=>startReturn(s)}>{saleNum(s.saleNumber)} — {s.customer.name}</button>)}</div>
      </div>
      {!filtered.length?<div className="empty"><div className="empty-icon">↩️</div><div className="empty-h">No returns</div></div>
      :filtered.map(r=><div key={r.id} className="sale-card" onClick={()=>setDetail(r)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <span style={{fontWeight:700,fontSize:14}}>{returnNum(r.returnNumber)}</span>
          <span className={`status-badge ${r.status==='completed'?'sb-completed':'sb-pending'}`}>{r.status}</span>
        </div>
        <div style={{fontSize:13}}>{r.customer.name}</div>
        <div style={{fontSize:11,color:'#B0ADA4'}}>From {saleNum(r.originalSaleNumber)} · {r.type} · {fmtDate(r.date)}</div>
        <div style={{fontSize:16,fontWeight:700,marginTop:6,color:'#DC2626'}}>−{fmtM(r.refundAmount)}</div>
      </div>)}
    </div>
    {createFrom&&<div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setCreateFrom(null)}}>
      <div className="sale-dtl">
        <div className="modal-head"><div className="modal-title">Return from {saleNum(createFrom.saleNumber)}</div><button className="btn-x" onClick={()=>setCreateFrom(null)}>×</button></div>
        <div className="modal-body">
          <div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Select items to return:</div>
            {createFrom.items.map(item=><div key={item.key} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 0',borderBottom:'1px solid #F5F3EF'}}>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:500}}>{item.productBrand} {item.productModel} ({item.variantName})</div><div style={{fontSize:11,color:'#B0ADA4'}}>Purchased qty: {item.quantity}</div></div>
              <div style={{display:'flex',alignItems:'center',gap:6}}><label style={{fontSize:11}}>Return qty:</label><input type="number" min="0" max={item.quantity} value={selItems[item.key]||0} onChange={e=>setSelItems(si=>({...si,[item.key]:Math.min(item.quantity,Math.max(0,Number(e.target.value)||0))}))} style={{width:60,padding:'4px 8px',borderRadius:6,border:'1px solid #E8E6E0',fontSize:13}}/></div>
            </div>)}
          </div>
          <div style={{display:'flex',gap:12,marginBottom:12}}>
            <div style={{flex:1}}><label style={{fontSize:11,fontWeight:500,display:'block',marginBottom:4}}>Reason</label><select value={reason} onChange={e=>setReason(e.target.value)} style={{width:'100%',padding:'6px 10px',borderRadius:6,border:'1px solid #E8E6E0',fontSize:13}}>{RETURN_REASONS.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}</select></div>

          </div>
          <textarea placeholder="Notes…" value={retNote} onChange={e=>setRetNote(e.target.value)} style={{width:'100%',padding:'8px 10px',borderRadius:6,border:'1px solid #E8E6E0',fontSize:13,minHeight:60}}/>
        </div>
        <div className="modal-foot"><button className="btn-secondary" onClick={()=>setCreateFrom(null)}>Cancel</button><button className="btn-primary" onClick={submitReturn}>Complete Return</button></div>
      </div>
    </div>}
    {detail&&<div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setDetail(null)}}>
      <div className="sale-dtl">
        <div className="modal-head"><div><div className="modal-title">{returnNum(detail.returnNumber)}</div><div style={{fontSize:12,color:'#B0ADA4'}}>{fmtDate(detail.date)} · From {saleNum(detail.originalSaleNumber)}</div></div><button className="btn-x" onClick={()=>setDetail(null)}>×</button></div>
        <div className="modal-body">
          <div style={{background:'#F8F7F4',borderRadius:10,padding:'14px 16px',marginBottom:16}}><div style={{fontSize:15,fontWeight:600}}>{detail.customer.name}</div><div style={{fontSize:12,color:'#666'}}>Type: {detail.type} · Reason: {detail.items[0]?.reason||'—'}</div></div>
          {detail.items.map((item,i)=><div key={i} style={{padding:'8px 0',borderBottom:'1px solid #F5F3EF'}}><div style={{fontSize:13,fontWeight:500}}>{item.productBrand} {item.productModel} ({item.variantName})</div><div style={{fontSize:12,color:'#B0ADA4'}}>Returned: {item.returnQty} · {fmtM(item.price*item.returnQty)}</div></div>)}
          <div style={{fontSize:16,fontWeight:700,marginTop:12,color:'#DC2626'}}>Refund: −{fmtM(detail.refundAmount)}</div>
          {detail.notes&&<div style={{marginTop:8,fontSize:12,color:'#888'}}>📌 {detail.notes}</div>}
        </div>
        <div className="modal-foot"><button className="btn-primary" onClick={()=>setDetail(null)}>Close</button></div>
      </div>
    </div>}
  </>);
}

/* ─── Warranty Page (Garantías) ─────────────────────────────── */
function WarrantyPage({sales,products}){
  const [q,setQ]=useState('');const [sf,setSf]=useState('all');
  const warranties=useMemo(()=>{
    const w=[];
    sales.filter(s=>s.status==='completed').forEach(s=>{
      s.items.forEach(item=>{
        const prod=products.find(p=>p.id===item.productId);
        const months=item.warrantyMonths||prod?.warrantyMonths||12;
        const endDate=warrantyEnd(s.date,months);
        const status=new Date()<=new Date(endDate)?'active':'expired';
        const daysLeft=Math.max(0,daysUntil(endDate));
        w.push({saleId:s.id,saleNumber:s.saleNumber,saleDate:s.date,customer:s.customer,item,warrantyMonths:months,endDate,status,daysLeft});
      });
