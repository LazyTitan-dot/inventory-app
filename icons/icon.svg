<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a8f"/>
      <stop offset="40%" style="stop-color:#2d5cc9"/>
      <stop offset="100%" style="stop-color:#c0272d"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a8f"/>
      <stop offset="50%" style="stop-color:#2d5cc9"/>
      <stop offset="100%" style="stop-color:#c0272d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Inner rounded square border (like the logo) -->
  <rect x="80" y="80" width="352" height="352" rx="64" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
  <!-- S letter -->
  <text x="175" y="330" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="240" fill="#ffffff" letter-spacing="-10">S</text>
  <!-- L letter -->
  <text x="280" y="330" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="240" fill="#ffffff" opacity="0.9" letter-spacing="-10">L</text>
  <!-- Power icon dot (like the logo) -->
  <circle cx="340" cy="140" r="16" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9"/>
  <line x1="340" y1="115" x2="340" y2="140" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
</svg>
