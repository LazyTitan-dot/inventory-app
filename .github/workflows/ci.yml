name: Calidad de SmartLiving

on:
  push:
    branches: [master, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Configuración pública ficticia utilizada por los controles existentes de CI.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Comprobar la selección de pruebas por módulo
        run: node --test tests/ci-browser-specs.test.mjs
      - name: Seleccionar las pruebas del cambio
        id: browser
        run: node scripts/ci-browser-specs.mjs
      - run: npm ci
      - run: npm run check
      - if: steps.browser.outputs.required == 'true'
        run: npm run test:shell:types
      - if: steps.browser.outputs.required == 'true'
        run: npx playwright install --with-deps chromium
      - name: Ejecutar las pruebas de navegador seleccionadas
        if: steps.browser.outputs.required == 'true'
        shell: bash
        run: |
          mapfile -d '' -t specs < "$RUNNER_TEMP/browser-specs"
          npx playwright test -- "${specs[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.browser.outputs.required == 'true'
        with:
          name: pruebas-de-navegador
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
