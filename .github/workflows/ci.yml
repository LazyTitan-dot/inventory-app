name: Calidad de SmartLiving

on:
  push:
    branches: [master, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Configuración pública ficticia: CI no accede a datos de producción.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  inventario-visual-v1:
    if: github.ref == 'refs/heads/codex/inventory-visual-refinement-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:shell:types
      - run: npx playwright test inventory-visual-v1 product-details product-editor catalog-scan-entry pricing-feedback pricing-rate scanner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-visual-v1-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14


  compras-visual-v1:
